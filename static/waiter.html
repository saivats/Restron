<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8">
    <title>Waiter Mode — Restron</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Restron waiter order entry — fast, mobile-first ordering for restaurant staff.">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#131313">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Restron">
    <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', {scope: '/'})
        .then(reg => console.log('SW registered'))
        .catch(err => console.log('SW failed:', err));
    }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script>
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    surface: "#0C0C0C", background: "#131313", card: "#161616", elevated: "#1A1A1A",
                    "surface-container": "#201f1f", "surface-bright": "#3a3939",
                    primary: "#c0c1ff", "primary-container": "#8083ff", secondary: "#d0bcff", tertiary: "#4edea3",
                    "on-surface": "#e5e2e1", "on-surface-variant": "#c7c4d7", "text-muted": "#888888",
                    "border-glass": "rgba(255,255,255,0.08)", outline: "#908fa0", "outline-variant": "#464554",
                    danger: "#EF4444", error: "#ffb4ab", warning: "#F59E0B",
                    gold: { light: "#fef08a", DEFAULT: "#eab308", dark: "#a16207" }
                },
                fontFamily: { display: ["Playfair Display","serif"], sans: ["Inter","sans-serif"], mono: ["JetBrains Mono","monospace"] }
            }
        }
    };
    </script>
    <style>
        .glass-card { background: linear-gradient(135deg, rgba(22,22,22,0.92) 0%, rgba(12,12,12,0.96) 100%); border: 1px solid rgba(255,255,255,0.06); }
        .gold-btn { background: linear-gradient(135deg, #eab308 0%, #a16207 100%); transition: all 0.3s ease; }
        .gold-btn:hover { box-shadow: 0 8px 32px rgba(234,179,8,0.35); transform: translateY(-1px); }
        .gold-btn:active { transform: scale(0.97); }
        .ornate-line { height: 1px; background: linear-gradient(90deg, transparent, rgba(234,179,8,0.3), transparent); }
        .input-field { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); transition: border-color 0.3s, box-shadow 0.3s; }
        .input-field:focus { border-color: rgba(234,179,8,0.5); box-shadow: 0 0 0 3px rgba(234,179,8,0.1); outline: none; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.2s; }
        .item-row:hover { background: rgba(234,179,8,0.04); }
        .item-row:last-child { border-bottom: none; }
        .qty-btn { width: 36px; height: 36px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; cursor: pointer; border: none; transition: all 0.15s; font-size: 18px; }
        .qty-btn:active { transform: scale(0.9); }
        .subscription-overlay { display: none; position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; text-align: center; color: #e5e2e1; }
    </style>
    <script>
    (function() {
      const parts = window.location.pathname.split('/');
      const rIndex = parts.indexOf('r');
      if (rIndex !== -1 && parts[rIndex + 1]) {
        const slug = parts[rIndex + 1];
        const link = document.querySelector('link[rel="manifest"]');
        if (link) link.href = '/r/' + slug + '/manifest.json';
      }
    })();
    </script>
</head>
<body class="bg-surface text-on-surface font-sans min-h-screen pb-24" style="background-image: radial-gradient(ellipse at 20% 0%, rgba(192,193,255,0.06) 0%, transparent 50%), radial-gradient(ellipse at 80% 100%, rgba(234,179,8,0.04) 0%, transparent 50%);">

    <div id="offline-banner" style="display:none; position:fixed; top:0; left:0; right:0; z-index:99999; background:#EF4444; color:white; text-align:center; padding:8px; font-size:13px; font-family:'Inter';">
      ⚡ You are offline — orders will sync when connection returns
    </div>

    <div class="subscription-overlay" id="sub-overlay"><div class="msg"><h2 class="text-2xl font-bold text-gold mb-2">⚠️ Subscription Expired</h2><p class="text-text-muted">Your subscription has expired. Please contact Restron support.</p></div></div>

    <header class="sticky top-0 z-40 backdrop-blur-xl border-b border-border-glass px-4 py-3" style="background: rgba(12,12,12,0.85);">
        <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-gold" style="font-variation-settings:'FILL' 1;">restaurant</span>
                <h1 class="font-display text-xl text-on-surface">Waiter Mode</h1>
            </div>
            <button onclick="logout()" class="text-text-muted hover:text-danger text-sm font-semibold border border-border-glass rounded-lg px-3 py-1.5 transition-colors">
                <span class="material-symbols-outlined text-sm align-middle mr-1">logout</span>Exit
            </button>
        </div>
        <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-muted text-xl">search</span>
            <input id="search" placeholder="Search menu items..." oninput="doSearch()"
                   class="input-field w-full rounded-xl pl-10 pr-4 py-2.5 text-on-surface text-sm placeholder:text-text-muted/50">
        </div>
    </header>

    <main class="px-4 pt-4">
        <div id="list" class="glass-card rounded-2xl overflow-hidden">
            <div class="p-6 text-center text-text-muted">Preparing menu...</div>
        </div>
    </main>

    <div class="fixed bottom-0 left-0 right-0 z-50 backdrop-blur-xl border-t border-border-glass px-4 py-3" style="background: rgba(12,12,12,0.9);">
        <div class="flex items-center justify-between gap-3">
            <span id="summary" class="text-sm font-semibold text-on-surface-variant">0 items | ₹0</span>
            <button class="gold-btn px-6 py-3 rounded-xl text-black font-bold text-sm uppercase tracking-wider" onclick="placeOrder()">
                <span class="material-symbols-outlined text-sm align-middle mr-1">send</span>Send to Kitchen
            </button>
        </div>
    </div>

    <script>
        let menu = [], cart = {}, fuse;

        async function init() {
            const res = await fetch('/menu/');
            menu = await res.json();
            fuse = new Fuse(menu, { keys: ['name', 'category'], threshold: 0.4 });
            render(menu);
        }

        function render(items) {
            const div = document.getElementById('list');
            div.innerHTML = '';
            let currentCategory = '';
            const sorted = [...items].sort((a,b) => (a.category || '').localeCompare(b.category || ''));
            sorted.forEach(i => {
                if(!i.is_available) return;
                if (i.category !== currentCategory) {
                    currentCategory = i.category;
                    div.innerHTML += `<div class="px-4 py-2.5 text-xs font-bold uppercase tracking-wider text-gold bg-surface-container/50 border-b border-border-glass">${currentCategory || 'General'}</div>`;
                }
                const qty = cart[i.id] || 0;
                div.innerHTML += `
                    <div class="item-row">
                        <div>
                            <div class="font-semibold text-sm text-on-surface">${i.name}</div>
                            <div class="text-xs text-text-muted mt-0.5">₹${i.price}</div>
                        </div>
                        <div class="flex items-center gap-2">
                            ${qty > 0 ? `<button class="qty-btn bg-surface-container text-on-surface hover:bg-danger/20 hover:text-danger" onclick="mod(${i.id}, -1)">−</button>` : ''}
                            ${qty > 0 ? `<span class="w-6 text-center font-mono font-bold text-gold">${qty}</span>` : ''}
                            <button class="qty-btn bg-gold/20 text-gold hover:bg-gold hover:text-black" onclick="mod(${i.id}, 1)">+</button>
                        </div>
                    </div>`;
            });
            if (div.innerHTML === '') div.innerHTML = '<div class="p-6 text-center text-text-muted">No items found</div>';
        }

        function doSearch() {
            const q = document.getElementById('search').value;
            if(!q) return render(menu);
            const res = fuse.search(q);
            render(res.map(r => r.item));
        }

        function mod(id, diff) {
            cart[id] = (cart[id] || 0) + diff;
            if(cart[id] <= 0) delete cart[id];
            updateCart();
            doSearch();
        }

        function updateCart() {
            let count = 0, total = 0;
            for(let id in cart) {
                const item = menu.find(i => i.id == parseInt(id));
                count += cart[id];
                total += cart[id] * item.price;
            }
            document.getElementById('summary').innerText = `${count} items | ₹${total}`;
        }

        async function placeOrder() {
            if(Object.keys(cart).length === 0) return alert("Empty Cart!");
            const table = prompt("Table Number?");
            if(!table) return;

            const items = [];
            for(let id in cart) items.push({menu_item_id: parseInt(id), quantity: cart[id]});

            const orderData = {
                table_number: parseInt(table),
                items: items,
                order_type: "Dine-in",
                taken_by: "Waiter"
            };

            if (navigator.onLine) {
                try {
                    await fetch('/order/', {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(orderData)
                    });
                    alert("Order Sent!");
                } catch (e) {
                    alert('Network error.');
                }
            } else {
                const db = await openRestronDB();
                await new Promise((resolve, reject) => {
                    const tx = db.transaction('pending_orders', 'readwrite');
                    tx.objectStore('pending_orders').add({
                        slug: 'default',
                        data: orderData,
                        timestamp: Date.now()
                    });
                    tx.oncomplete = resolve;
                    tx.onerror = reject;
                });
                if ('serviceWorker' in navigator && 'SyncManager' in window) {
                    const sw = await navigator.serviceWorker.ready;
                    await sw.sync.register('sync-orders');
                }
                alert('Order queued — will sync automatically');
            }
            cart = {}; updateCart(); doSearch();
        }

        function logout() { fetch('/logout', {method:'POST'}).then(() => window.location.href='/'); }

        function openRestronDB() {
          return new Promise((resolve, reject) => {
            const req = indexedDB.open('restron-offline', 1);
            req.onupgradeneeded = e => {
              const db = e.target.result;
              if (!db.objectStoreNames.contains('pending_orders'))
                db.createObjectStore('pending_orders', {keyPath: 'id', autoIncrement: true});
              if (!db.objectStoreNames.contains('pending_checkouts'))
                db.createObjectStore('pending_checkouts', {keyPath: 'id', autoIncrement: true});
            };
            req.onsuccess = e => resolve(e.target.result);
            req.onerror = e => reject(e.target.error);
          });
        }

        function showExpiredOverlay(data) {
            const overlay = document.getElementById('sub-overlay');
            if (!overlay) return;
            if (data.plan === 'trial' && data.expired === true) {
                overlay.querySelector('p').innerText = 'Your 15-day free trial has ended. Contact Restron to activate your subscription.';
            } else if (data.plan === 'starter' && data.growth_preview_used === true && data.growth_preview_expires_at) {
                overlay.querySelector('p').innerText = 'Your Growth preview has ended. Contact Restron to upgrade your plan.';
            }
            overlay.style.display = 'flex';
        }

        async function checkSubscription() {
            try {
                const res = await fetch('/restaurant/status/');
                if (res.ok) {
                    const data = await res.json();
                    let expired = false;
                    if (data.is_active === false) expired = true;
                    if (data.expired === true) expired = true;
                    if (data.plan_expires_at && new Date(data.plan_expires_at) < new Date()) expired = true;
                    if (expired) showExpiredOverlay(data);
                }
            } catch (e) { }
        }

        function updateOnlineStatus() {
          const banner = document.getElementById('offline-banner');
          if (banner) banner.style.display = navigator.onLine ? 'none' : 'block';
        }
        window.addEventListener('online', () => {
          updateOnlineStatus();
          if ('serviceWorker' in navigator && 'SyncManager' in window) {
            navigator.serviceWorker.ready.then(sw => {
              sw.sync.register('sync-orders');
            });
          }
          if (typeof init === 'function') init();
        });
        window.addEventListener('offline', updateOnlineStatus);
        document.addEventListener('DOMContentLoaded', updateOnlineStatus);

        checkSubscription();
        init();
    </script>
</body>
</html>
