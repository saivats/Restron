<script>
        let menu = [], cart = {}, fuse;

        async function init() {
            const res = await fetch('/menu/');
            menu = await res.json();
            fuse = new Fuse(menu, { keys: ['name', 'category'], threshold: 0.4 });
            render(menu);
        }

        function render(items) {
            const div = document.getElementById('list');
            div.innerHTML = '';
            items.forEach(i => {
                if(!i.is_available) return;
                const qty = cart[i.id] || 0;
                div.innerHTML += `
<div class="glass-card rounded-2xl p-4 flex items-center justify-between group active:scale-[0.98] transition-transform duration-200 mb-2">
<div class="flex items-center gap-4">
<div class="w-16 h-16 rounded-xl overflow-hidden bg-surface-container-highest flex-shrink-0">
<img class="w-full h-full object-cover" src="${i.image_url || 'https://lh3.googleusercontent.com/aida-public/AB6AXuBNC3OJXM7opvp_Jw08hE4vfHt7jGTfgAiT6hRX5xz-CWF25HlTPXuwC-Nc3yOUTq2pmvw4Bync3RNEE0rAOedRpRQ-_EJJrIsiPrzzJ7tdJed0kYDrojp_DWoGEjmulEdGYSRaiJLezlY8m60ZWF0mjtYwyhG6XFXSrTX_e4UHegUREQm-wlKO-dTvgAsYIP__JaeLWouOjM8TsvCDCO_Q4pvygYPvOqn9NipSXfTPYgWNniK_57x-9y9Z5m3XeISVBwS-KVcVD2E'}"/>
</div>
<div>
<h3 class="font-bold text-text-primary text-body-lg">${i.name}</h3>
<p class="text-primary font-bold">₹${i.price}</p>
</div>
</div>
<div class="flex items-center bg-surface-container-lowest/50 rounded-xl p-1 border border-white/5">
<button class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-white/5 text-primary active:scale-90 transition-all ${qty > 0 ? '' : 'invisible'}" onclick="mod(${i.id}, -1)">
<span class="material-symbols-outlined">remove</span>
</button>
<span class="w-8 text-center font-bold text-text-primary text-body-md" id="qty-${i.id}">${qty > 0 ? qty : '0'}</span>
<button class="w-10 h-10 flex items-center justify-center rounded-lg bg-primary-container text-on-primary-container shadow-md active:scale-90 transition-all" onclick="mod(${i.id}, 1)">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>`;
            });
        }

        function doSearch() {
            const q = document.getElementById('search').value;
            if(!q) return render(menu);
            const res = fuse.search(q);
            render(res.map(r => r.item));
        }

        function mod(id, diff) {
            cart[id] = (cart[id] || 0) + diff;
            if(cart[id] <= 0) delete cart[id];
            updateCart();
            doSearch(); // Refresh view
        }

        function updateCart() {
            let count = 0, total = 0;
            for(let id in cart) {
                const item = menu.find(i => i.id == parseInt(id));
                count += cart[id];
                total += cart[id] * item.price;
            }
            document.getElementById('summary').innerText = `${count} items | ₹${total}`;
        }

        async function placeOrder() {
            if(Object.keys(cart).length === 0) return alert("Empty Cart!");
            const table = prompt("Table Number?");
            if(!table) return;

            const items = [];
            for(let id in cart) items.push({menu_item_id: parseInt(id), quantity: cart[id]});

            await fetch('/order/', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    table_number: parseInt(table),
                    items: items,
                    order_type: "Dine-in",
                    taken_by: "Waiter"
                })
            });
            alert("Order Sent!");
            cart = {}; updateCart(); doSearch();
        }

        function logout() { fetch('/logout', {method:'POST'}).then(() => window.location.href='/'); }

        async function checkSubscription() {
            try {
                const res = await fetch('/restaurant/status/');
                if (res.ok) {
                    const data = await res.json();
                    let expired = false;
                    if (data.is_active === false) expired = true;
                    if (data.plan_expires_at && new Date(data.plan_expires_at) < new Date()) expired = true;
                    if (expired) document.getElementById('sub-overlay').style.display = 'flex';
                }
            } catch (e) { }
        }

        checkSubscription();
        init();
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js').catch(console.warn);
        }
    </script>
