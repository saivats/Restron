<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8">
    <title>Kitchen Display — Restron</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Restron kitchen display — real-time order tickets for your kitchen staff.">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#131313">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Restron">
    <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', {scope: '/'})
        .then(reg => console.log('SW registered'))
        .catch(err => console.log('SW failed:', err));
    }
    </script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script>
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    surface: "#0C0C0C", background: "#131313", card: "#161616", elevated: "#1A1A1A",
                    "surface-container": "#201f1f", "surface-bright": "#3a3939",
                    primary: "#c0c1ff", "primary-container": "#8083ff", secondary: "#d0bcff", tertiary: "#4edea3",
                    "on-surface": "#e5e2e1", "on-surface-variant": "#c7c4d7", "text-muted": "#888888",
                    "border-glass": "rgba(255,255,255,0.08)", outline: "#908fa0", "outline-variant": "#464554",
                    danger: "#EF4444", error: "#ffb4ab", warning: "#F59E0B",
                    gold: { light: "#fef08a", DEFAULT: "#eab308", dark: "#a16207" }
                },
                fontFamily: { display: ["Playfair Display","serif"], sans: ["Inter","sans-serif"], mono: ["JetBrains Mono","monospace"] }
            }
        }
    };
    </script>
    <style>
        .glass-card { background: linear-gradient(135deg, rgba(22,22,22,0.92) 0%, rgba(12,12,12,0.96) 100%); border: 1px solid rgba(255,255,255,0.06); box-shadow: 0 8px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04); }
        .subscription-overlay { display: none; position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; text-align: center; color: #e5e2e1; }
        #orders-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .order-card { background: #161616; border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 20px; transition: all 0.3s; }
        .order-card:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(0,0,0,0.3); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .table-no { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; color: #eab308; }
        .order-id { font-family: 'JetBrains Mono', monospace; color: #888; font-size: 0.85rem; }
        .items { color: #c7c4d7; font-size: 0.9rem; line-height: 1.7; margin-bottom: 14px; }
        .done-btn { background: linear-gradient(135deg, #4edea3, #22c55e); color: black; font-weight: 700; padding: 10px 20px; border-radius: 12px; cursor: pointer; border: none; font-family: 'Inter'; width: 100%; transition: all 0.2s; font-size: 0.9rem; }
        .done-btn:hover { box-shadow: 0 8px 28px rgba(78,222,163,0.35); transform: translateY(-1px); }
        .done-btn:active { transform: scale(0.97); }
        .timer-badge { padding: 6px 14px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; display: inline-block; margin-bottom: 12px; }
        .timer-badge.time-ok { background: rgba(78,222,163,0.15); color: #4edea3; border: 1px solid rgba(78,222,163,0.25); }
        .timer-badge.time-warn { background: rgba(234,179,8,0.15); color: #eab308; border: 1px solid rgba(234,179,8,0.25); }
        .timer-badge.time-late { background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid rgba(239,68,68,0.3); animation: pulse 1.5s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .delivery-tag { color: black; background: linear-gradient(135deg, #EF4444, #dc2626); padding: 6px 14px; border-radius: 999px; display: inline-flex; margin-bottom: 10px; font-weight: 800; font-size: 0.8rem; }
        .btn-kot { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: #c7c4d7; padding: 6px 14px; border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer; font-family: 'Inter'; transition: all 0.2s; margin-bottom: 10px; display: inline-block; }
        .btn-kot:hover { border-color: rgba(234,179,8,0.4); color: #eab308; }
    </style>
    <script>
    (function() {
      const parts = window.location.pathname.split('/');
      const rIndex = parts.indexOf('r');
      if (rIndex !== -1 && parts[rIndex + 1]) {
        const slug = parts[rIndex + 1];
        const link = document.querySelector('link[rel="manifest"]');
        if (link) link.href = '/r/' + slug + '/manifest.json';
      }
    })();
    </script>
</head>
<body class="bg-surface text-on-surface font-sans min-h-screen p-4 md:p-8" style="background-image: radial-gradient(ellipse at 20% 0%, rgba(192,193,255,0.06) 0%, transparent 50%), radial-gradient(ellipse at 80% 100%, rgba(234,179,8,0.04) 0%, transparent 50%);">

    <div id="offline-banner" style="display:none; position:fixed; top:0; left:0; right:0; z-index:99999; background:#EF4444; color:white; text-align:center; padding:8px; font-size:13px; font-family:'Inter';">
      ⚡ You are offline — showing last known orders
    </div>
    <div class="subscription-overlay" id="sub-overlay"><div class="msg"><h2 class="text-2xl font-bold text-gold mb-2">⚠️ Subscription Expired</h2><p class="text-text-muted">Your subscription has expired. Please contact Restron support.</p></div></div>

    <header class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-gold text-3xl" style="font-variation-settings:'FILL' 1;">soup_kitchen</span>
            <h1 class="font-display text-2xl md:text-3xl text-on-surface">Kitchen Live Orders</h1>
        </div>
        <span id="last-updated-label" class="text-text-muted text-xs"></span>
    </header>

    <div id="orders-container">
        <p class="text-text-muted text-center col-span-full py-8">Connecting to Kitchen...</p>
    </div>

    <script>
        let orders = [];
        let kitchenSocket = null;
        let autoPrintKot = false;
        const printedKotIds = new Set();

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[ch]));
        }

        async function loadKitchenSettings() {
            try {
                const res = await fetch('/restaurant/settings/', { credentials: 'include' });
                if (res.ok) {
                    const data = await res.json();
                    autoPrintKot = !!data.auto_print_kot;
                }
            } catch (e) { }
        }

        function connectKitchenSocket() {
            if (!('WebSocket' in window)) return;
            const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
            kitchenSocket = new WebSocket(`${protocol}://${window.location.host}/orders/ws/kitchen`);
            kitchenSocket.onmessage = async (event) => {
                let incomingOrderId = null;
                try {
                    const payload = JSON.parse(event.data);
                    incomingOrderId = payload.order?.id || payload.order?.order_id || null;
                } catch (e) { }
                await fetchOrders();
                if (autoPrintKot && incomingOrderId && !printedKotIds.has(incomingOrderId)) {
                    printedKotIds.add(incomingOrderId);
                    printKOT(incomingOrderId);
                }
            };
            kitchenSocket.onclose = () => setTimeout(connectKitchenSocket, 5000);
        }

        async function fetchOrders() {
            try {
                const response = await fetch('/kitchen-display/', {
                    credentials: 'include'
                });
                if (!response.ok) {
                    if (response.status === 401) {
                        window.location.href = '/login';
                        return;
                    }
                    throw new Error('Failed to fetch orders');
                }
                orders = await response.json();
                renderOrders();
            } catch (err) {
                console.error("Fetch error", err);
                document.getElementById('orders-container').innerHTML =
                    '<p class="text-danger text-center col-span-full py-8">❌ Connection Error. Check console.</p>';
            }
        }

        function renderOrders() {
            const container = document.getElementById('orders-container');
            container.innerHTML = '';

            if (orders.length === 0) {
                container.innerHTML = '<p class="text-text-muted text-center col-span-full py-8">No Pending Orders. Relax! ☕</p>';
                return;
            }

            orders.forEach(order => {
                const deliveryTag = order.order_type === "Delivery" ? '<div class="delivery-tag">🛵 DELIVERY - PACK IT</div>' : '';
                const tableName = order.order_type === 'Delivery' ? 'No Table' : 'Table ' + order.table_number;
                const orderTime = new Date(order.created_at + "Z");
                const timerHtml = `<div id="timer-${order.id}" class="timer-badge time-ok">Loading...</div>`;

                const card = `
                    <div class="order-card" data-time="${orderTime.getTime()}">
                        ${deliveryTag}
                        ${timerHtml}
                        <div class="card-header">
                            <span class="table-no">${tableName}</span>
                            <span class="order-id">#${order.id}</span>
                        </div>
                        <div class="items">${order.items_summary}</div>
                        <button onclick="printKOT(${order.id})" class="btn-kot">Print KOT</button>
                        <button class="done-btn" onclick="markDone(${order.id})">✔ Mark Ready</button>
                    </div>
                `;
                container.innerHTML += card;
            });
            updateTimers();
        }

        function updateTimers() {
            const cards = document.querySelectorAll('.order-card');
            const now = new Date().getTime();

            cards.forEach(card => {
                const startTime = parseInt(card.getAttribute('data-time'));
                const orderId = card.querySelector('.order-id').innerText.replace('#', '');
                const timerEl = document.getElementById(`timer-${orderId}`);

                const diffMs = now - startTime;
                const diffSec = Math.floor(diffMs / 1000);
                const diffMin = Math.floor(diffSec / 60);

                const threshold = 15;

                if (diffMin < threshold) {
                    const leftMin = 14 - diffMin;
                    const leftSec = 59 - (diffSec % 60);
                    const display = `${String(leftMin).padStart(2, '0')}:${String(leftSec).padStart(2, '0')}`;

                    timerEl.innerText = `⏱️ Time Left: ${display}`;
                    timerEl.className = (diffMin >= 10) ? "timer-badge time-warn" : "timer-badge time-ok";
                } else {
                    const lateMs = diffMs - (threshold * 60 * 1000);
                    const lateSecTotal = Math.floor(lateMs / 1000);
                    const lateMin = Math.floor(lateSecTotal / 60);
                    const lateSec = lateSecTotal % 60;
                    const display = `${String(lateMin).padStart(2, '0')}:${String(lateSec).padStart(2, '0')}`;

                    timerEl.innerText = `⚠️ LATE BY: ${display}`;
                    timerEl.className = "timer-badge time-late";
                }
            });
        }

        function printKOT(orderId) {
            const order = orders.find(o => o.id === orderId || o.order_id === orderId);
            if (!order) return alert('Order not found for printing.');
            const lines = (order.items && order.items.length)
                ? order.items.map(item => `<div>${escapeHtml(item.qty)}x ${escapeHtml(item.name)}</div>`).join('')
                : escapeHtml(order.items_summary || '').split(',').map(line => `<div>${escapeHtml(line.trim())}</div>`).join('');
            const time = order.created_at ? new Date(order.created_at).toLocaleString() : new Date().toLocaleString();
            const html = `<!doctype html><html><head><title>KOT ${order.id}</title><style>
                body { font-family: 'Courier New', monospace; font-size: 10px; width: 80mm; color: black; background: white; }
                .center { text-align: center; font-weight: bold; }
                @media print {
                  @page { width: 80mm; margin: 2mm; }
                  body { font-family: 'Courier New', monospace; font-size: 10px; width: 80mm; color: black; background: white; }
                }
            </style></head><body>
                <div>================================</div>
                <div class="center">KITCHEN ORDER</div>
                <div>================================</div>
                <div>Table: ${escapeHtml(order.table_number || '-')}     KOT: ${escapeHtml(order.kot_number || order.id)}</div>
                <div>Time: ${escapeHtml(time)}</div>
                <div>--------------------------------</div>
                ${lines}
                <div>--------------------------------</div>
                <div>Order Type: ${escapeHtml(order.order_type || 'Dine-in')}</div>
                <div>================================</div>
                <script>window.onload=function(){window.print(); setTimeout(function(){window.close();}, 500);};<\/script>
            </body></html>`;
            const win = window.open('', '_blank', 'width=360,height=640');
            if (!win) return alert('Allow popups to print KOT.');
            win.document.write(html);
            win.document.close();
        }

        async function markDone(orderId) {
            try {
                const response = await fetch(`/order/${orderId}/done`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({ detail: 'Unknown error' }));
                    alert(`Failed to mark order as done: ${errorData.detail || 'Unknown error'}`);
                    return;
                }

                const result = await response.json();
                fetchOrders();
            } catch (err) {
                console.error('Error marking done:', err);
                alert('Network error: ' + err.message);
            }
        }

        function showExpiredOverlay(data) {
            const overlay = document.getElementById('sub-overlay');
            if (!overlay) return;
            if (data.plan === 'trial' && data.expired === true) {
                overlay.querySelector('p').innerText = 'Your 15-day free trial has ended. Contact Restron to activate your subscription.';
            } else if (data.plan === 'starter' && data.growth_preview_used === true && data.growth_preview_expires_at) {
                overlay.querySelector('p').innerText = 'Your Growth preview has ended. Contact Restron to upgrade your plan.';
            }
            overlay.style.display = 'flex';
        }

        async function checkSubscription() {
            try {
                const res = await fetch('/restaurant/status/');
                if (res.ok) {
                    const data = await res.json();
                    let expired = false;
                    if (data.is_active === false) expired = true;
                    if (data.expired === true) expired = true;
                    if (data.plan_expires_at && new Date(data.plan_expires_at) < new Date()) expired = true;
                    if (expired) showExpiredOverlay(data);
                }
            } catch (e) { }
        }

        checkSubscription();
        loadKitchenSettings();
        fetchOrders();
        connectKitchenSocket();
        let lastDataFetchTime = null;

        function updateLastUpdatedLabel() {
            const label = document.getElementById('last-updated-label');
            if (!label || !lastDataFetchTime) return;
            if (navigator.onLine) { label.innerText = ''; return; }
            const diffMs = Date.now() - lastDataFetchTime;
            const diffMin = Math.floor(diffMs / 60000);
            label.innerText = diffMin < 1 ? 'Last updated: just now' : `Last updated: ${diffMin} min ago`;
        }

        const origFetchOrders = fetchOrders;
        fetchOrders = async function() {
            try {
                await origFetchOrders.apply(this, arguments);
                lastDataFetchTime = Date.now();
            } catch (e) {
                updateLastUpdatedLabel();
            }
        };

        function updateOnlineStatus() {
          const banner = document.getElementById('offline-banner');
          if (banner) banner.style.display = navigator.onLine ? 'none' : 'block';
          updateLastUpdatedLabel();
        }
        window.addEventListener('online', () => {
          updateOnlineStatus();
          if (typeof fetchOrders === 'function') fetchOrders();
          if (typeof connectKitchenSocket === 'function') connectKitchenSocket();
        });
        window.addEventListener('offline', updateOnlineStatus);
        document.addEventListener('DOMContentLoaded', updateOnlineStatus);
        setInterval(updateLastUpdatedLabel, 30000);
        setInterval(fetchOrders, 10000);
        setInterval(updateTimers, 1000);
    </script>
</body>
</html>
