<!DOCTYPE html>
<html>
<head>
    <title>Restron Kitchen Display</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#E8851A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Restron">
    <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', {scope: '/'})
        .then(reg => console.log('SW registered'))
        .catch(err => console.log('SW failed:', err));
    }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0D0A06;
            --bg-surface: #1A1208;
            --bg-card: #221A0E;
            --primary: #E8851A;
            --primary-dark: #C4690E;
            --secondary: #8B1A3A;
            --text-primary: #F5E6D0;
            --text-muted: #9A8070;
            --border: rgba(232, 133, 26, 0.15);
            --glow: rgba(232, 133, 26, 0.08);
            --success: #2D7A4F;
            --danger: #8B1A1A;
            --bg-color: #0D0A06;
            --surface-color: rgba(26, 21, 16, 0.8);
            --primary-color: #E8851A;
            --secondary-color: #8B1A3A;
            --success-color: #2E7D32;
            --error-color: #93000a;
            --text-primary: #F5EBE1;
            --text-secondary: #A89F95;
            --border-color: rgba(255, 255, 255, 0.1);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-color) !important;
            color: var(--text-primary) !important;
            font-family: 'DM Sans', sans-serif !important;
            min-height: 100vh;
            padding: 1rem;
            background-image: radial-gradient(circle at 50% -20%, rgba(232, 133, 26, 0.15) 0%, transparent 60%) !important;
        }
        @media (min-width: 768px) { body { padding: 2rem; } }
        
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Playfair Display', serif !important;
            color: var(--primary-color) !important;
            margin-bottom: 1rem;
        }
        
        h1 { font-size: 1.875rem !important; font-weight: 700; }
        h2 { font-size: 1.5rem !important; font-weight: 600; }
        h3 { font-size: 1.25rem !important; font-weight: 500; }
        
        p { color: var(--text-secondary); margin-bottom: 1rem; }
        
        input, select, textarea {
            width: 100%;
            background-color: #1A1510;
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            color: var(--text-primary);
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(232, 133, 26, 0.2);
        }
        
        label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }
        
        table { width: 100%; text-align: left; border-collapse: collapse; margin-bottom: 1.5rem; }
        th { 
            padding: 0.75rem 1rem; 
            background-color: rgba(255, 255, 255, 0.05); 
            font-size: 0.75rem; 
            color: rgba(255, 255, 255, 0.5); 
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
            border-bottom: 1px solid var(--border-color); 
        }
        td { padding: 0.75rem 1rem; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.875rem; }
        tr:hover { background-color: rgba(255, 255, 255, 0.05); transition: background-color 0.3s; }
        
        .login-container, .form-container {
            background-color: var(--surface-color);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 2rem;
            max-width: 28rem;
            margin: 0 auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }
        
        .form-group { margin-bottom: 1rem; }
        
        .header { display: flex; flex-direction: column; justify-content: space-between; align-items: center; margin-bottom: 2rem; gap: 1rem; }
        @media (min-width: 768px) { .header { flex-direction: row; } }
        
        .header-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
        
        .card, .menu-item, .order-card, .table-card, .staff-card, .qr-card {
            background-color: var(--surface-color) !important;
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color) !important;
            border-radius: 1rem !important;
            padding: 1.5rem !important;
            box-shadow: 0 4px 30px rgba(232,133,26,0.05) !important;
            margin-bottom: 1.5rem !important;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            color: var(--text-primary);
        }
        .card:hover, .menu-item:hover, .order-card:hover, .table-card:hover, .staff-card:hover, .qr-card:hover {
            box-shadow: 0 8px 40px rgba(232,133,26,0.15) !important;
            border-color: rgba(232,133,26,0.2) !important;
            transform: translateY(-4px);
        }
        
        /* Table specifics */
        .table-card { text-align: center; justify-content: center; align-items: center; }
        .table-card h3 { margin-bottom: 0.5rem; }
        .table-card.occupied { border-color: rgba(147, 0, 10, 0.5) !important; box-shadow: 0 0 15px rgba(147, 0, 10, 0.2) !important; }
        .table-card.available { border-color: rgba(46, 125, 50, 0.5) !important; box-shadow: 0 0 15px rgba(46, 125, 50, 0.2) !important; }

        /* Kitchen Orders */
        .order-card h3 { display: flex; justify-content: space-between; align-items: center; font-size: 1.25rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; }
        .order-items { margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .order-item { display: flex; justify-content: space-between; font-size: 0.875rem; padding: 0.5rem; background-color: rgba(255, 255, 255, 0.05); border-radius: 0.5rem; }
        
        /* Buttons */
        button, .btn {
            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease-out;
            padding: 0.5rem 1.5rem;
            border-radius: 0.75rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
            border: none;
        }
        button:active, .btn:active { transform: scale(0.95); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .btn-primary, button[type="submit"], button[onclick*="login"], button[onclick*="generate"], .place-btn {
            background-color: var(--primary-color) !important;
            color: #4c2700 !important;
            box-shadow: 0 4px 15px rgba(232, 133, 26, 0.2);
        }
        .btn-primary:hover, button[type="submit"]:hover, button[onclick*="login"]:hover, button[onclick*="generate"]:hover, .place-btn:hover {
            background-color: #ffb77b !important;
        }
        
        .btn-danger { background-color: var(--error-color); color: #ffdad6; }
        .btn-danger:hover { background-color: #ffb4ab; color: #690005; }
        
        .btn-outline, .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
        }
        .btn-outline:hover, .btn-secondary:hover { background-color: rgba(232, 133, 26, 0.1); }
        
        .btn-small { padding: 0.375rem 0.75rem; font-size: 0.75rem; border-radius: 0.5rem; }
        
        .btn-success, .done-btn { background-color: var(--success-color) !important; color: white !important; }
        .btn-success:hover, .done-btn:hover { background-color: #388e3c !important; }

        .qty-btn { 
            width: 2rem; height: 2rem; border-radius: 0.5rem; padding: 0; display: inline-flex; 
            align-items: center; justify-content: center; font-weight: bold; background-color: rgba(255,255,255,0.1); color: var(--text-primary);
        }
        .qty-btn:hover { background-color: rgba(255,255,255,0.2); }
        
        .modal {
            position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center;
            background-color: rgba(13, 10, 6, 0.8); backdrop-filter: blur(4px); padding: 1rem;
        }
        .modal-content {
            background-color: rgba(26, 21, 16, 0.95); backdrop-filter: blur(12px); width: 100%; max-width: 42rem;
            border-radius: 1rem; padding: 2rem; border: 1px solid var(--border-color); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            position: relative; max-height: 90vh; overflow-y: auto; margin: auto; margin-top: 2.5rem;
        }
        .modal-close {
            position: absolute; right: 1rem; top: 1rem; color: rgba(255, 255, 255, 0.5); cursor: pointer; font-size: 1.5rem; line-height: 1;
        }
        .modal-close:hover { color: white; }
        
        .badge, .timer-badge {
            padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.05em; border: 1px solid transparent; display: inline-block;
        }
        .badge-active { background-color: rgba(46, 125, 50, 0.2); color: #4ade80; border-color: rgba(46, 125, 50, 0.3); }
        .badge-inactive { background-color: rgba(147, 0, 10, 0.2); color: #f87171; border-color: rgba(147, 0, 10, 0.3); }
        .badge-paid, .badge-premium, .status-paid, .status-ready { background-color: rgba(232, 133, 26, 0.2); color: var(--primary-color); border-color: rgba(232, 133, 26, 0.3); }
        .badge-trial, .status-pending, .status-preparing, .timer-badge { background-color: rgba(120, 53, 15, 0.3); color: #facc15; border-color: rgba(234, 179, 8, 0.3); }
        .badge-free { background-color: rgba(255, 255, 255, 0.05); color: var(--text-secondary); border-color: var(--border-color); }
        .status-delivered { background-color: rgba(46, 125, 50, 0.2); color: #4ade80; border-color: rgba(46, 125, 50, 0.3); }
        
        .stats-panel, .credentials-box, .order-details, .items-list {
            background-color: rgba(0, 0, 0, 0.3); padding: 1rem; border-radius: 0.75rem; border: 1px solid rgba(255, 255, 255, 0.05); margin-top: 1rem;
        }
        .stat-row { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .stat-row:last-child { border-bottom: none; }
        .stat-label { color: var(--text-secondary); font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .stat-value { font-weight: 700; color: var(--primary-color); font-size: 1.125rem; }
        
        .tabs, .tab-bar { display: flex; overflow-x: auto; border-bottom: 1px solid var(--border-color); margin-bottom: 1.5rem; padding-bottom: 0.5rem; gap: 1rem; }
        .tab { padding: 0.5rem 1rem; cursor: pointer; color: var(--text-secondary); border-bottom: 2px solid transparent; transition: color 0.3s; white-space: nowrap; }
        .tab:hover { color: white; }
        .tab.active { color: var(--primary-color); border-bottom-color: var(--primary-color); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        #orders-container, #menu-container, #staff-list, .grid-cards {
            display: grid; grid-template-columns: 1fr; gap: 1.5rem;
        }
        @media (min-width: 768px) { #orders-container, #menu-container, #staff-list, .grid-cards { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 1024px) { #orders-container, #menu-container, #staff-list, .grid-cards { grid-template-columns: repeat(3, 1fr); } }
        
        .table-no { font-size: 48px; line-height: 1; font-weight: 800; color: var(--text-primary); }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin: 14px 0; }
        .order-id { color: var(--text-muted); font-weight: 700; }
        .items { font-size: 1.2rem; line-height: 1.5; margin: 1rem 0; color: var(--text-primary); }
        .done-btn { width: 100%; padding: 16px 20px !important; font-size: 1.1rem; border-radius: 12px !important; background: linear-gradient(135deg, #2D7A4F, #1D5A3F) !important; }
        .timer-badge.time-ok { background: rgba(45,122,79,0.2); color: #4CAF7D; border-color: rgba(45,122,79,0.3); }
        .timer-badge.time-warn { background: rgba(232,133,26,0.2); color: #E8851A; border-color: rgba(232,133,26,0.3); }
        .timer-badge.time-late { background: rgba(139,26,26,0.25); color: #E85A5A; border-color: rgba(139,26,26,0.35); }
        .delivery-tag { color: #F5E6D0; background: rgba(139,26,58,0.35); border: 1px solid rgba(139,26,58,0.45); padding: 8px 12px; border-radius: 999px; display: inline-flex; margin-bottom: 8px; font-weight: 800; }
        .item-row, .menu-item-row { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .staff-card, .qr-card, .checkout-modal, .customer-card, .history-row { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
        .item-row:last-child { border-bottom: none; }
        .modifier-group { background-color: rgba(0, 0, 0, 0.2); padding: 0.75rem; border-radius: 0.5rem; border: 1px solid rgba(255, 255, 255, 0.05); margin-bottom: 0.75rem; }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .qr-modal-overlay {
            position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center;
            background-color: rgba(13, 10, 6, 0.8); backdrop-filter: blur(4px); padding: 1rem;
        }
        .qr-modal {
            background-color: rgba(26, 21, 16, 0.95); backdrop-filter: blur(12px); border-radius: 1rem; padding: 2rem; border: 1px solid var(--border-color); text-align: center;
        }
        .qr-modal img { margin: 1rem auto; max-width: 200px; display: block; border-radius: 0.5rem; }
        .qr-url { word-break: break-all; color: var(--text-secondary); font-size: 0.875rem; }

        .subscription-overlay {
            display: none; position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; text-align: center; color: #F5EBE1;
        }
        
        /* Menu overrides that were lost when stripping tailwind */
        .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface-color); padding: 1rem; border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; z-index: 50; }
        .search-box { margin-bottom: 1rem; }
        .ornate-divider { display: flex; align-items: center; margin: 2rem 0 1rem; text-align: center; }
        .ornate-divider::before, .ornate-divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--primary-color); opacity: 0.3; }
        .scroll-mt-40 { scroll-margin-top: 10rem; }
        .glass-effect { background-color: rgba(26, 21, 16, 0.9); backdrop-filter: blur(12px); }

    </style>
    <script>
    (function() {
      const parts = window.location.pathname.split('/');
      const rIndex = parts.indexOf('r');
      if (rIndex !== -1 && parts[rIndex + 1]) {
        const slug = parts[rIndex + 1];
        const link = document.querySelector('link[rel="manifest"]');
        if (link) link.href = '/r/' + slug + '/manifest.json';
      }
    })();
    </script>
</head>
<body>
    <div id="offline-banner" style="display:none; position:fixed; top:0; left:0; right:0; z-index:99999; background:#8B1A1A; color:white; text-align:center; padding:8px; font-size:13px; font-family:'DM Sans';">
      ⚡ You are offline — showing last known orders
    </div>
    <div class="subscription-overlay" id="sub-overlay"><div class="msg"><h2>⚠️ Subscription Expired</h2><p>Your subscription has expired. Please contact Restron support.</p></div></div>
    <div class="header"><h1>🧑‍🍳 Kitchen Live Orders</h1><span id="last-updated-label" style="color:var(--text-muted); font-size:12px;"></span></div>
    <div id="orders-container"><p style="text-align:center; width:100%">Connecting to Kitchen...</p></div>

    <script>
        let orders = [];
        let kitchenSocket = null;
        let autoPrintKot = false;
        const printedKotIds = new Set();

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[ch]));
        }

        async function loadKitchenSettings() {
            try {
                const res = await fetch('/restaurant/settings/', { credentials: 'include' });
                if (res.ok) {
                    const data = await res.json();
                    autoPrintKot = !!data.auto_print_kot;
                }
            } catch (e) { }
        }

        function connectKitchenSocket() {
            if (!('WebSocket' in window)) return;
            const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
            kitchenSocket = new WebSocket(`${protocol}://${window.location.host}/orders/ws/kitchen`);
            kitchenSocket.onmessage = async (event) => {
                let incomingOrderId = null;
                try {
                    const payload = JSON.parse(event.data);
                    incomingOrderId = payload.order?.id || payload.order?.order_id || null;
                } catch (e) { }
                await fetchOrders();
                if (autoPrintKot && incomingOrderId && !printedKotIds.has(incomingOrderId)) {
                    printedKotIds.add(incomingOrderId);
                    printKOT(incomingOrderId);
                }
            };
            kitchenSocket.onclose = () => setTimeout(connectKitchenSocket, 5000);
        }

        async function fetchOrders() {
            try {
                const response = await fetch('/kitchen-display/', {
                    credentials: 'include'  // Include cookies for authentication
                });
                if (!response.ok) {
                    if (response.status === 401) {
                        window.location.href = '/login';
                        return;
                    }
                    throw new Error('Failed to fetch orders');
                }
                orders = await response.json();
                renderOrders();
            } catch (err) {
                console.error("Fetch error", err);
                document.getElementById('orders-container').innerHTML =
                    '<p style="color:#ff5722; text-align:center;">❌ Connection Error. Check console.</p>';
            }
        }

        function renderOrders() {
            const container = document.getElementById('orders-container');
            container.innerHTML = '';

            if (orders.length === 0) {
                container.innerHTML = '<p style="color:#777;">No Pending Orders. Relax! ☕</p>';
                return;
            }

            orders.forEach(order => {
                const deliveryTag = order.order_type === "Delivery" ? '<div class="delivery-tag">🛵 DELIVERY - PACK IT</div>' : '';
                const tableName = order.order_type === 'Delivery' ? 'No Table' : 'Table ' + order.table_number;

                // Calculate Time
                // Note: Server sends UTC. We treat it as "Order Time".
                // We calculate difference locally.
                const orderTime = new Date(order.created_at + "Z"); // Append Z to treat as UTC

                // HTML Placeholder for Timer (updated by updateTimers function)
                const timerHtml = `<div id="timer-${order.id}" class="timer-badge time-ok">Loading...</div>`;

                const card = `
                    <div class="order-card" data-time="${orderTime.getTime()}">
                        ${deliveryTag}
                        ${timerHtml}
                        <div class="card-header">
                            <span class="table-no">${tableName}</span>
                            <span class="order-id">#${order.id}</span>
                        </div>
                        <div class="items">${order.items_summary}</div>
                        <button onclick="printKOT(${order.id})" class="btn btn-outline btn-small" style="margin-bottom:10px;">Print KOT</button>
                        <button class="done-btn" onclick="markDone(${order.id})">✔ Mark Ready</button>
                    </div>
                `;
                container.innerHTML += card;
            });
            updateTimers(); // Run once immediately
        }

        function updateTimers() {
            const cards = document.querySelectorAll('.order-card');
            const now = new Date().getTime();

            cards.forEach(card => {
                const startTime = parseInt(card.getAttribute('data-time'));
                const orderId = card.querySelector('.order-id').innerText.replace('#', '');
                const timerEl = document.getElementById(`timer-${orderId}`);

                const diffMs = now - startTime;
                const diffSec = Math.floor(diffMs / 1000);
                const diffMin = Math.floor(diffSec / 60);

                const threshold = 15; // 15 Minutes

                if (diffMin < threshold) {
                    // ON TIME
                    const leftMin = 14 - diffMin; // 14 because we are in the current minute
                    const leftSec = 59 - (diffSec % 60);
                    const display = `${String(leftMin).padStart(2, '0')}:${String(leftSec).padStart(2, '0')}`;

                    timerEl.innerText = `⏱️ Time Left: ${display}`;
                    timerEl.className = (diffMin >= 10) ? "timer-badge time-warn" : "timer-badge time-ok";
                } else {
                    // LATE
                    const lateMs = diffMs - (threshold * 60 * 1000);
                    const lateSecTotal = Math.floor(lateMs / 1000);
                    const lateMin = Math.floor(lateSecTotal / 60);
                    const lateSec = lateSecTotal % 60;
                    const display = `${String(lateMin).padStart(2, '0')}:${String(lateSec).padStart(2, '0')}`;

                    timerEl.innerText = `⚠️ LATE BY: ${display}`;
                    timerEl.className = "timer-badge time-late";
                }
            });
        }

        function printKOT(orderId) {
            const order = orders.find(o => o.id === orderId || o.order_id === orderId);
            if (!order) return alert('Order not found for printing.');
            const lines = (order.items && order.items.length)
                ? order.items.map(item => `<div>${escapeHtml(item.qty)}x ${escapeHtml(item.name)}</div>`).join('')
                : escapeHtml(order.items_summary || '').split(',').map(line => `<div>${escapeHtml(line.trim())}</div>`).join('');
            const time = order.created_at ? new Date(order.created_at).toLocaleString() : new Date().toLocaleString();
            const html = `<!doctype html><html><head><title>KOT ${order.id}</title><style>
                body { font-family: 'Courier New', monospace; font-size: 10px; width: 80mm; color: black; background: white; }
                .center { text-align: center; font-weight: bold; }
                @media print {
                  @page { width: 80mm; margin: 2mm; }
                  body { font-family: 'Courier New', monospace; font-size: 10px; width: 80mm; color: black; background: white; }
                }
            </style></head><body>
                <div>================================</div>
                <div class="center">KITCHEN ORDER</div>
                <div>================================</div>
                <div>Table: ${escapeHtml(order.table_number || '-')}     KOT: ${escapeHtml(order.kot_number || order.id)}</div>
                <div>Time: ${escapeHtml(time)}</div>
                <div>--------------------------------</div>
                ${lines}
                <div>--------------------------------</div>
                <div>Order Type: ${escapeHtml(order.order_type || 'Dine-in')}</div>
                <div>================================</div>
                <script>window.onload=function(){window.print(); setTimeout(function(){window.close();}, 500);};<\/script>
            </body></html>`;
            const win = window.open('', '_blank', 'width=360,height=640');
            if (!win) return alert('Allow popups to print KOT.');
            win.document.write(html);
            win.document.close();
        }

        async function markDone(orderId) {
            try {
                const response = await fetch(`/order/${orderId}/done`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({ detail: 'Unknown error' }));
                    alert(`Failed to mark order as done: ${errorData.detail || 'Unknown error'}`);
                    return;
                }
                
                const result = await response.json();
                fetchOrders(); // Refresh orders list
            } catch (err) {
                console.error('Error marking done:', err);
                alert('Network error: ' + err.message);
            }
        }

        // Initial Load
        function showExpiredOverlay(data) {
            const overlay = document.getElementById('sub-overlay');
            if (!overlay) return;
            if (data.plan === 'trial' && data.expired === true) {
                overlay.querySelector('p').innerText = 'Your 15-day free trial has ended. Contact Restron to activate your subscription.';
            } else if (data.plan === 'starter' && data.growth_preview_used === true && data.growth_preview_expires_at) {
                overlay.querySelector('p').innerText = 'Your Growth preview has ended. Contact Restron to upgrade your plan.';
            }
            overlay.style.display = 'flex';
        }

        async function checkSubscription() {
            try {
                const res = await fetch('/restaurant/status/');
                if (res.ok) {
                    const data = await res.json();
                    let expired = false;
                    if (data.is_active === false) expired = true;
                    if (data.expired === true) expired = true;
                    if (data.plan_expires_at && new Date(data.plan_expires_at) < new Date()) expired = true;
                    if (expired) showExpiredOverlay(data);
                }
            } catch (e) { }
        }

        checkSubscription();
        loadKitchenSettings();
        fetchOrders();
        connectKitchenSocket();
        let lastDataFetchTime = null;

        function updateLastUpdatedLabel() {
            const label = document.getElementById('last-updated-label');
            if (!label || !lastDataFetchTime) return;
            if (navigator.onLine) { label.innerText = ''; return; }
            const diffMs = Date.now() - lastDataFetchTime;
            const diffMin = Math.floor(diffMs / 60000);
            label.innerText = diffMin < 1 ? 'Last updated: just now' : `Last updated: ${diffMin} min ago`;
        }

        const origFetchOrders = fetchOrders;
        fetchOrders = async function() {
            try {
                await origFetchOrders.apply(this, arguments);
                lastDataFetchTime = Date.now();
            } catch (e) {
                updateLastUpdatedLabel();
            }
        };

        function updateOnlineStatus() {
          const banner = document.getElementById('offline-banner');
          if (banner) banner.style.display = navigator.onLine ? 'none' : 'block';
          updateLastUpdatedLabel();
        }
        window.addEventListener('online', () => {
          updateOnlineStatus();
          if (typeof fetchOrders === 'function') fetchOrders();
          if (typeof connectKitchenSocket === 'function') connectKitchenSocket();
        });
        window.addEventListener('offline', updateOnlineStatus);
        document.addEventListener('DOMContentLoaded', updateOnlineStatus);
        setInterval(updateLastUpdatedLabel, 30000);
        setInterval(fetchOrders, 10000);
        setInterval(updateTimers, 1000);

    </script>
</body>
</html>
