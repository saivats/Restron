<!DOCTYPE html>
<html>
<head>
    <title>Restron Kitchen Display</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              background: "#0D0A06",
              surface: "#1A1510",
              primary: "#E8851A",
              secondary: "#8B1A3A",
              success: "#2E7D32",
              error: "#93000a",
              "text-primary": "#F5EBE1",
              "text-secondary": "#A89F95"
            },
            fontFamily: {
              sans: ["DM Sans", "sans-serif"],
              serif: ["Playfair Display", "serif"]
            }
          }
        }
      }
    </script>
    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-background text-text-primary font-sans min-h-screen p-4 md:p-8;
                background-image: radial-gradient(circle at 50% -20%, rgba(232, 133, 26, 0.15) 0%, transparent 60%);
            }
            h1, h2, h3, h4, h5, h6 {
                @apply font-serif text-primary mb-4;
            }
            h1 { @apply text-3xl font-bold; }
            h2 { @apply text-2xl font-semibold; }
            h3 { @apply text-xl font-medium; }
            p { @apply text-text-secondary mb-4; }
            
            input, select, textarea {
                @apply w-full bg-surface border border-white/10 rounded-xl px-4 py-3 text-base focus:ring-primary focus:border-primary transition-all text-text-primary mb-4;
            }
            label {
                @apply block text-text-secondary text-sm font-semibold uppercase tracking-wider mb-1;
            }
            table { @apply w-full text-left border-collapse mb-6; }
            th { @apply px-4 py-3 bg-white/5 text-xs text-white/50 uppercase tracking-wider border-b border-white/10; }
            td { @apply px-4 py-3 border-b border-white/5 text-sm; }
            tr:hover { @apply bg-white/5 transition-colors; }
            
            /* Login page forms */
            .login-container, .form-container {
                @apply bg-surface/80 backdrop-blur-md border border-white/10 rounded-2xl p-8 max-w-md mx-auto shadow-[0_20px_50px_rgba(0,0,0,0.5)] relative overflow-hidden;
            }
            .form-group { @apply mb-4; }
        }
        
        @layer components {
            .header { @apply flex flex-col md:flex-row justify-between items-center mb-8 gap-4; }
            .header-actions { @apply flex gap-2 flex-wrap justify-center; }
            
            .card, .menu-item, .order-card {
                @apply bg-surface/80 backdrop-blur-md border border-white/10 rounded-2xl p-6 shadow-[0_4px_30px_rgba(232,133,26,0.05)] mb-6 relative overflow-hidden transition-all duration-300;
            }
            .card:hover, .menu-item:hover, .order-card:hover {
                @apply shadow-[0_8px_40px_rgba(232,133,26,0.15)] border-primary/20 transform -translate-y-1;
            }
            
            button, .btn {
                @apply font-semibold transition-all duration-300 ease-out active:scale-95 px-6 py-2 rounded-xl inline-flex items-center justify-center gap-2 cursor-pointer;
            }
            .btn-primary, button[type="submit"], button[onclick*="login"], button[onclick*="generate"] {
                @apply bg-primary text-[#4c2700] hover:bg-[#ffb77b] shadow-lg shadow-primary/20 border-0;
            }
            .btn-danger {
                @apply bg-error text-[#ffdad6] hover:bg-[#ffb4ab] hover:text-[#690005] border-0;
            }
            .btn-outline, .btn-secondary {
                @apply bg-transparent border border-primary text-primary hover:bg-primary/10;
            }
            .btn-small {
                @apply px-3 py-1.5 text-xs rounded-lg;
            }
            .btn-success {
                @apply bg-success text-white hover:bg-green-600 border-0;
            }
            
            .modal {
                @apply fixed inset-0 z-[100] hidden items-center justify-center bg-background/80 backdrop-blur-sm p-4;
            }
            .modal-content {
                @apply bg-surface/95 backdrop-blur-md w-full max-w-2xl rounded-2xl p-8 border border-white/10 shadow-2xl relative max-h-[90vh] overflow-y-auto m-auto mt-10;
            }
            .modal-close {
                @apply absolute right-4 top-4 text-white/50 hover:text-white cursor-pointer text-2xl;
            }
            
            .badge {
                @apply px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider border inline-block;
            }
            .badge-active { @apply bg-success/20 text-green-400 border-success/30; }
            .badge-inactive { @apply bg-error/20 text-red-400 border-error/30; }
            .badge-paid, .badge-premium, .status-paid, .status-ready { @apply bg-primary/20 text-primary border-primary/30; }
            .badge-trial, .status-pending, .status-preparing { @apply bg-yellow-900/30 text-yellow-400 border-yellow-500/30; }
            .badge-free { @apply bg-white/5 text-text-secondary border-white/10; }
            .status-delivered { @apply bg-success/20 text-green-400 border-success/30; }
            
            .stats-panel, .credentials-box, .order-details, .items-list {
                @apply bg-black/30 p-4 rounded-xl border border-white/5 mt-4;
            }
            .stat-row {
                @apply flex justify-between py-2 border-b border-white/5 last:border-0;
            }
            .stat-label { @apply text-text-secondary text-sm uppercase tracking-wider; }
            .stat-value { @apply font-bold text-primary text-lg; }
            
            /* Tabs */
            .tabs, .tab-bar { @apply flex overflow-x-auto border-b border-white/10 mb-6 pb-2 gap-4 hide-scrollbar; }
            .tab { @apply px-4 py-2 cursor-pointer text-text-secondary hover:text-white border-b-2 border-transparent transition-colors whitespace-nowrap; }
            .tab.active { @apply text-primary border-primary; }
            .tab-content { @apply hidden; }
            .tab-content.active { @apply block; }
            
            /* Grid layouts */
            #orders-container, #menu-container, #staff-list, .grid-cards {
                @apply grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6;
            }
            
            /* Modifiers & Items */
            .item-row { @apply flex justify-between items-center py-2 border-b border-white/5 last:border-0; }
            .modifier-group { @apply bg-black/20 p-3 rounded-lg border border-white/5 mb-3; }
            
            /* Kitchen/Waiter specific */
            .order-card h3 { @apply flex justify-between items-center text-xl mb-4 border-b border-white/10 pb-2; }
            .order-items { @apply space-y-2 mb-4; }
            .order-item { @apply flex justify-between text-sm p-2 bg-white/5 rounded-lg; }
            
            /* Hide scrollbar for tabs */
            .hide-scrollbar::-webkit-scrollbar { display: none; }
            .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        }
    </style>
</head>
<body>
    <div class="subscription-overlay" id="sub-overlay"><div class="msg"><h2>⚠️ Subscription Expired</h2><p>Your subscription has expired. Please contact Restron support.</p></div></div>
    <div class="header"><h1>🧑‍🍳 Kitchen Live Orders</h1></div>
    <div id="orders-container"><p style="text-align:center; width:100%">Connecting to Kitchen...</p></div>

    <script>
        let orders = [];
        let kitchenSocket = null;

        function connectKitchenSocket() {
            if (!('WebSocket' in window)) return;
            const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
            kitchenSocket = new WebSocket(`${protocol}://${window.location.host}/orders/ws/kitchen`);
            kitchenSocket.onmessage = () => fetchOrders();
            kitchenSocket.onclose = () => setTimeout(connectKitchenSocket, 5000);
        }

        async function fetchOrders() {
            try {
                const response = await fetch('/kitchen-display/', {
                    credentials: 'include'  // Include cookies for authentication
                });
                if (!response.ok) {
                    if (response.status === 401) {
                        window.location.href = '/login';
                        return;
                    }
                    throw new Error('Failed to fetch orders');
                }
                orders = await response.json();
                renderOrders();
            } catch (err) {
                console.error("Fetch error", err);
                document.getElementById('orders-container').innerHTML =
                    '<p style="color:#ff5722; text-align:center;">❌ Connection Error. Check console.</p>';
            }
        }

        function renderOrders() {
            const container = document.getElementById('orders-container');
            container.innerHTML = '';

            if (orders.length === 0) {
                container.innerHTML = '<p style="color:#777;">No Pending Orders. Relax! ☕</p>';
                return;
            }

            orders.forEach(order => {
                const deliveryTag = order.order_type === "Delivery" ? '<div class="delivery-tag">🛵 DELIVERY - PACK IT</div>' : '';
                const tableName = order.order_type === 'Delivery' ? 'No Table' : 'Table ' + order.table_number;

                // Calculate Time
                // Note: Server sends UTC. We treat it as "Order Time".
                // We calculate difference locally.
                const orderTime = new Date(order.created_at + "Z"); // Append Z to treat as UTC

                // HTML Placeholder for Timer (updated by updateTimers function)
                const timerHtml = `<div id="timer-${order.id}" class="timer-badge time-ok">Loading...</div>`;

                const card = `
                    <div class="order-card" data-time="${orderTime.getTime()}">
                        ${deliveryTag}
                        ${timerHtml}
                        <div class="card-header">
                            <span class="table-no">${tableName}</span>
                            <span class="order-id">#${order.id}</span>
                        </div>
                        <div class="items">${order.items_summary}</div>
                        <button class="done-btn" onclick="markDone(${order.id})">✔ Mark Ready</button>
                    </div>
                `;
                container.innerHTML += card;
            });
            updateTimers(); // Run once immediately
        }

        function updateTimers() {
            const cards = document.querySelectorAll('.order-card');
            const now = new Date().getTime();

            cards.forEach(card => {
                const startTime = parseInt(card.getAttribute('data-time'));
                const orderId = card.querySelector('.order-id').innerText.replace('#', '');
                const timerEl = document.getElementById(`timer-${orderId}`);

                const diffMs = now - startTime;
                const diffSec = Math.floor(diffMs / 1000);
                const diffMin = Math.floor(diffSec / 60);

                const threshold = 15; // 15 Minutes

                if (diffMin < threshold) {
                    // ON TIME
                    const leftMin = 14 - diffMin; // 14 because we are in the current minute
                    const leftSec = 59 - (diffSec % 60);
                    const display = `${String(leftMin).padStart(2, '0')}:${String(leftSec).padStart(2, '0')}`;

                    timerEl.innerText = `⏱️ Time Left: ${display}`;
                    timerEl.className = (diffMin >= 10) ? "timer-badge time-warn" : "timer-badge time-ok";
                } else {
                    // LATE
                    const lateMs = diffMs - (threshold * 60 * 1000);
                    const lateSecTotal = Math.floor(lateMs / 1000);
                    const lateMin = Math.floor(lateSecTotal / 60);
                    const lateSec = lateSecTotal % 60;
                    const display = `${String(lateMin).padStart(2, '0')}:${String(lateSec).padStart(2, '0')}`;

                    timerEl.innerText = `⚠️ LATE BY: ${display}`;
                    timerEl.className = "timer-badge time-late";
                }
            });
        }

        async function markDone(orderId) {
            try {
                const response = await fetch(`/order/${orderId}/done`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({ detail: 'Unknown error' }));
                    alert(`Failed to mark order as done: ${errorData.detail || 'Unknown error'}`);
                    return;
                }
                
                const result = await response.json();
                fetchOrders(); // Refresh orders list
            } catch (err) {
                console.error('Error marking done:', err);
                alert('Network error: ' + err.message);
            }
        }

        // Initial Load
        async function checkSubscription() {
            try {
                const res = await fetch('/restaurant/status/');
                if (res.ok) {
                    const data = await res.json();
                    let expired = false;
                    if (data.is_active === false) expired = true;
                    if (data.plan_expires_at && new Date(data.plan_expires_at) < new Date()) expired = true;
                    if (expired) document.getElementById('sub-overlay').style.display = 'flex';
                }
            } catch (e) { }
        }

        checkSubscription();
        fetchOrders();
        connectKitchenSocket();
        // Poll for new orders every 10s
        setInterval(fetchOrders, 10000);
        // Update Timers every 1s
        setInterval(updateTimers, 1000);
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js').catch(console.warn);
        }

    </script>
</body>
</html>
