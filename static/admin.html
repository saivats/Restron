<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8">
    <title>Menu Admin — Restron</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Restron menu admin — quick dish management.">
    <meta name="theme-color" content="#131313">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <script>
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    surface: "#0C0C0C", background: "#131313", card: "#161616", elevated: "#1A1A1A",
                    "surface-container": "#201f1f",
                    primary: "#c0c1ff", "on-surface": "#e5e2e1", "text-muted": "#888888",
                    "border-glass": "rgba(255,255,255,0.08)",
                    danger: "#EF4444",
                    gold: { light: "#fef08a", DEFAULT: "#eab308", dark: "#a16207" }
                },
                fontFamily: { display: ["Playfair Display","serif"], sans: ["Inter","sans-serif"], mono: ["JetBrains Mono","monospace"] }
            }
        }
    };
    </script>
    <style>
        .glass-card { background: linear-gradient(135deg, rgba(22,22,22,0.92) 0%, rgba(12,12,12,0.96) 100%); border: 1px solid rgba(255,255,255,0.06); box-shadow: 0 8px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04); }
        .gold-btn { background: linear-gradient(135deg, #eab308 0%, #a16207 100%); color: #0C0C0C; transition: all 0.2s ease; }
        .gold-btn:hover { box-shadow: 0 8px 32px rgba(234,179,8,0.35); transform: translateY(-1px); }
        .gold-btn:active { transform: scale(0.97); }
        .stat-card { background: #161616; border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 20px; text-align: center; }
        .stat-number { font-family: 'JetBrains Mono', monospace; font-size: 1.8rem; font-weight: 700; color: #eab308; display: block; }
        .stat-label { color: #888; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 4px; display: block; }
        input, select { width: 100%; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 0.75rem; padding: 0.65rem 1rem; font-size: 0.9rem; color: #e5e2e1; font-family: 'Inter', sans-serif; margin-bottom: 0.75rem; transition: border-color 0.3s, box-shadow 0.3s; }
        input:focus, select:focus { border-color: rgba(234,179,8,0.5); box-shadow: 0 0 0 3px rgba(234,179,8,0.1); outline: none; }
        button.add-btn { width: 100%; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-size: 0.95rem; font-weight: 700; font-family: 'Inter', sans-serif; }
        .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .menu-item span b { color: #e5e2e1; }
        .del-btn { background: rgba(239,68,68,0.12); color: #EF4444; border: 1px solid rgba(239,68,68,0.3); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 0.8rem; font-weight: 600; transition: all 0.2s; }
        .del-btn:hover { background: rgba(239,68,68,0.2); }
    </style>
</head>
<body class="bg-surface text-on-surface font-sans min-h-screen p-4 md:p-8" style="background-image: radial-gradient(ellipse at 20% 0%, rgba(192,193,255,0.06) 0%, transparent 50%), radial-gradient(ellipse at 80% 100%, rgba(234,179,8,0.04) 0%, transparent 50%);">

    <h1 class="font-display text-2xl md:text-3xl text-on-surface mb-6">Menu Admin</h1>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8 max-w-3xl">
        <div class="stat-card">
            <span class="stat-number" id="revenue">₹0</span>
            <span class="stat-label">Total Revenue</span>
        </div>
        <div class="stat-card">
            <span class="stat-number" id="orders-count">0</span>
            <span class="stat-label">Total Orders</span>
        </div>
        <div class="stat-card">
            <span class="stat-number" id="pending-count">0</span>
            <span class="stat-label">Kitchen Pending</span>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-4xl">
        <div class="glass-card rounded-2xl p-6">
            <h2 class="font-display text-lg text-on-surface mb-4 pb-2 border-b border-border-glass">Add New Dish</h2>
            <input type="text" id="name" placeholder="Dish Name (e.g. Butter Chicken)">
            <input type="number" id="price" placeholder="Price (e.g. 350)">
            <select id="category">
                <option value="Starters">Starters</option>
                <option value="Main Course">Main Course</option>
                <option value="Drinks">Drinks</option>
                <option value="Desserts">Desserts</option>
            </select>
            <button class="add-btn gold-btn" onclick="addItem()">Add to Menu</button>
        </div>

        <div class="glass-card rounded-2xl p-6">
            <h2 class="font-display text-lg text-on-surface mb-4 pb-2 border-b border-border-glass">Current Menu</h2>
            <div id="menu-list" class="text-text-muted">Loading...</div>
        </div>
    </div>

    <script>
        // 1. Load Stats — revenue/orders from the same analytics endpoint the
        // owner dashboard uses, pending count from the kitchen stats endpoint.
        async function loadStats() {
            try {
                const [analyticsRes, statsRes] = await Promise.all([
                    fetch('/owner/analytics/'),
                    fetch('/stats/'),
                ]);
                const analytics = await analyticsRes.json();
                const stats = await statsRes.json();
                document.getElementById('revenue').innerText = "₹" + (analytics.revenue?.total ?? 0);
                document.getElementById('orders-count').innerText = analytics.total_orders ?? 0;
                document.getElementById('pending-count').innerText = stats.pending ?? 0;
            } catch (e) {
                console.error('Failed to load stats', e);
            }
        }

        // 2. Load Menu List
        async function loadMenu() {
            const res = await fetch('/menu/');
            const data = await res.json();
            const container = document.getElementById('menu-list');
            container.innerHTML = "";

            if (!data.length) {
                container.innerHTML = '<p class="text-text-muted text-sm">No dishes yet — add one on the left.</p>';
                return;
            }

            data.forEach(item => {
                container.innerHTML += `
                    <div class="menu-item">
                        <span><b>${item.name}</b> (₹${item.price})</span>
                        <button class="del-btn" onclick="deleteItem(${item.id})">Delete</button>
                    </div>
                `;
            });
        }

        // 3. Add Item Function
        async function addItem() {
            const name = document.getElementById('name').value;
            const price = document.getElementById('price').value;
            const category = document.getElementById('category').value;

            if(!name || !price) return alert("Please fill details");

            await fetch(`/menu/?name=${encodeURIComponent(name)}&price=${encodeURIComponent(price)}&category=${encodeURIComponent(category)}`, { method: 'POST' });

            document.getElementById('name').value = '';
            document.getElementById('price').value = '';
            loadMenu();
        }

        // 4. Delete Item Function
        async function deleteItem(id) {
            if(confirm("Are you sure you want to remove this dish?")) {
                await fetch(`/menu/${id}`, { method: 'DELETE' });
                loadMenu();
            }
        }

        loadStats();
        loadMenu();
    </script>
</body>
</html>
