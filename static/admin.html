<!DOCTYPE html>
<html>
<head>
    <title>Restron Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #080808; --bg-surface: #111111; --bg-card: #161616; --primary: #6366F1; --primary-dark: #4F46E5; --secondary: #8B5CF6; --text-primary: #F0F0F0; --text-muted: #888888; --border: rgba(99, 102, 241, 0.15); --glow: rgba(99, 102, 241, 0.08); --success: #22C55E; --danger: #EF4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; padding: 24px; background: var(--bg-base); background-image: radial-gradient(ellipse at top, #2A1A08 0%, #080808 70%); color: var(--text-primary); min-height: 100vh; }
        h1,h2,h3 { font-family: 'Inter', serif; color: var(--primary); }
        h1 { margin-bottom: 24px; }
        .stats-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card, .column { background: var(--bg-card); border: 1px solid var(--border); padding: 24px; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05); }
        .stat-number { display: block; font-size: 2em; font-weight: bold; color: var(--primary); }
        .stat-label { color: var(--text-muted); }
        .main-content { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        h2 { border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 16px; }
        input, select { width: 100%; padding: 10px 14px; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 10px; background: rgba(255,255,255,0.05); color: var(--text-primary); font-family:'Inter'; }
        button.add-btn { width: 100%; padding: 10px; background: linear-gradient(135deg, #22C55E, #1D5A3F); color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 1em; }
        .menu-item, .menu-item-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .del-btn { background: linear-gradient(135deg, #EF4444, #6B1010); color: white; border: none; padding: 7px 12px; border-radius: 8px; cursor: pointer; }
        .table-card, .occupied, .available, .order-card, .done-btn, .timer-badge, .item-row, .qty-btn, .staff-card, .qr-card, .checkout-modal, .customer-card, .history-row { border-radius: 12px; }
    </style>
</head>
<body>

    <h1>📊 Manager Dashboard</h1>

    <div class="stats-bar">
        <div class="stat-card">
            <span class="stat-number" id="revenue">₹0</span>
            <span class="stat-label">Total Revenue</span>
        </div>
        <div class="stat-card">
            <span class="stat-number" id="orders-count">0</span>
            <span class="stat-label">Total Orders</span>
        </div>
        <div class="stat-card">
            <span class="stat-number" id="pending-count">0</span>
            <span class="stat-label">Kitchen Pending</span>
        </div>
    </div>

    <div class="main-content">
        <div class="column">
            <h2>➕ Add New Dish</h2>
            <input type="text" id="name" placeholder="Dish Name (e.g. Butter Chicken)">
            <input type="number" id="price" placeholder="Price (e.g. 350)">
            <select id="category">
                <option value="Starters">Starters</option>
                <option value="Main Course">Main Course</option>
                <option value="Drinks">Drinks</option>
                <option value="Desserts">Desserts</option>
            </select>
            <button class="add-btn" onclick="addItem()">Add to Menu</button>
        </div>

        <div class="column">
            <h2>📜 Current Menu</h2>
            <div id="menu-list">Loading...</div>
        </div>
    </div>

    <script>
        // 1. Load Stats
        async function loadStats() {
            // FIXED: Relative path
            const res = await fetch('/stats/');
            const data = await res.json();
            document.getElementById('revenue').innerText = "₹" + data.revenue;
            document.getElementById('orders-count').innerText = data.total_orders;
            document.getElementById('pending-count').innerText = data.pending;
        }

        // 2. Load Menu List
        async function loadMenu() {
            // FIXED: Relative path
            const res = await fetch('/menu/');
            const data = await res.json();
            const container = document.getElementById('menu-list');
            container.innerHTML = "";

            data.forEach(item => {
                container.innerHTML += `
                    <div class="menu-item">
                        <span><b>${item.name}</b> (₹${item.price})</span>
                        <button class="del-btn" onclick="deleteItem(${item.id})">Delete</button>
                    </div>
                `;
            });
        }

        // 3. Add Item Function
        async function addItem() {
            const name = document.getElementById('name').value;
            const price = document.getElementById('price').value;
            const category = document.getElementById('category').value;

            if(!name || !price) return alert("Please fill details");

            // FIXED: Relative path
            await fetch(`/menu/?name=${name}&price=${price}&category=${category}`, { method: 'POST' });

            document.getElementById('name').value = '';
            document.getElementById('price').value = '';
            loadMenu();
        }

        // 4. Delete Item Function
        async function deleteItem(id) {
            if(confirm("Are you sure you want to remove this dish?")) {
                // FIXED: Relative path
                await fetch(`/menu/${id}`, { method: 'DELETE' });
                loadMenu();
            }
        }

        loadStats();
        loadMenu();
    </script>
</body>
</html>
