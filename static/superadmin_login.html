<style>

        }

        .glass-card {

<body class="font-body-md text-text-primary selection:bg-primary-container selection:text-on-primary-container flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Atmospheric Background Elements -->
<div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] ambient-glow opacity-20 rounded-full animate-float"></div>
<div class="fixed bottom-[-10%] right-[-10%] w-[50%] h-[50%] ambient-glow opacity-10 rounded-full animate-float" style="animation-delay: -5s;"></div>
<main class="relative z-10 w-full max-w-md">
<!-- TopAppBar Content & Identity -->
<div class="flex flex-col items-center mb-10 space-y-4">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">shield_person</span>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">Restron</h1>
</div>
<p class="font-label-sm text-label-sm text-text-secondary uppercase tracking-[0.2em]">Super Admin Portal</p>
</div>
<!-- Central Login Card -->
<div class="glass-card rounded-2xl p-8 md:p-10 shadow-[0_20px_50px_rgba(13,10,6,0.5)] relative overflow-hidden group">
<!-- Subtle Inner Glow -->
<div class="absolute inset-0 bg-gradient-to-tr from-primary/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-700 pointer-events-none"></div>
<div class="relative">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-2">Welcome Back</h2>
<p class="font-body-md text-text-secondary mb-8">Secure access to administrative controls</p>
<!-- Message Container -->
<div class="mb-6 empty:hidden font-label-md text-label-md px-4 py-3 rounded-lg border bg-error-container/20 border-error/20 text-error transition-all duration-300" id="msg"></div>
<form class="space-y-6" onsubmit="event.preventDefault(); login();">
<!-- Username Input -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant" for="u">Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-secondary text-lg">person</span>
<input class="w-full bg-surface-container-lowest/50 border border-outline-variant rounded-xl py-3.5 pl-12 pr-4 text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all duration-300 font-body-md" id="u" name="username" placeholder="Enter admin ID" required="" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-on-surface-variant" for="p">Password</label>
<a class="text-primary font-label-sm hover:underline transition-all" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-secondary text-lg">lock</span>
<input class="w-full bg-surface-container-lowest/50 border border-outline-variant rounded-xl py-3.5 pl-12 pr-12 text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all duration-300 font-body-md" id="p" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-text-secondary hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-lg" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-on-primary font-label-md text-label-md py-4 rounded-xl shadow-[0_8px_20px_rgba(232,133,26,0.3)] hover:shadow-[0_12px_24px_rgba(232,133,26,0.4)] hover:bg-primary transition-all duration-300 transform active:scale-[0.96] flex items-center justify-center gap-2 group" onclick="login()" type="submit">
                        Access Dashboard
                        <span class="material-symbols-outlined text-lg group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
</div>
</div>
<!-- Footer Information -->
<footer class="mt-12 text-center space-y-4">
<div class="flex justify-center gap-6">
<a class="font-label-sm text-label-sm text-text-secondary hover:text-primary transition-colors" href="#">Security Policy</a>
<a class="font-label-sm text-label-sm text-text-secondary hover:text-primary transition-colors" href="#">System Status</a>
<a class="font-label-sm text-label-sm text-text-secondary hover:text-primary transition-colors" href="#">Privacy</a>
</div>
<p class="font-label-sm text-label-sm text-text-secondary opacity-60">
                © 2024 Restron Platform. All rights reserved.
            </p>
</footer>
</main>
<script>
        async function login() {
            const u = document.getElementById('u').value;
            const p = document.getElementById('p').value;
            const formData = new FormData();
            formData.append('username', u);
            formData.append('password', p);

            try {
                const res = await fetch('/superadmin/token', { method: 'POST', body: formData });
                if (res.ok) {
                    window.location.href = '/superadmin/dashboard';
                } else {
                    const err = await res.json().catch(() => ({ detail: 'Login failed' }));
                    const msg = document.getElementById('msg');
                    msg.innerText = err.detail || "Invalid credentials";
                    msg.classList.remove('hidden');
                }
            } catch (error) {
                const msg = document.getElementById('msg');
                msg.innerText = "Network error. Please try again.";
                msg.classList.remove('hidden');
            }
        }

        document.getElementById('p').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });

        function togglePassword() {
            const pInput = document.getElementById('p');
            const eyeIcon = document.getElementById('eye-icon');
            if (pInput.type === 'password') {
                pInput.type = 'text';
                eyeIcon.textContent = 'visibility_off';
            } else {
                pInput.type = 'password';
                eyeIcon.textContent = 'visibility';
            }
        }
    </script>
</body></html>
