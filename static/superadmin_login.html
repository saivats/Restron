<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8">
    <title>Super Admin Login — Restron</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Restron platform super admin login.">
    <meta name="theme-color" content="#131313">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script>
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    surface: "#0C0C0C", background: "#131313", card: "#161616", elevated: "#1A1A1A",
                    "surface-container": "#201f1f", "surface-bright": "#3a3939",
                    primary: "#c0c1ff", "primary-container": "#8083ff", secondary: "#d0bcff", tertiary: "#4edea3",
                    "on-surface": "#e5e2e1", "on-surface-variant": "#c7c4d7", "text-muted": "#888888",
                    "border-glass": "rgba(255,255,255,0.08)", outline: "#908fa0", "outline-variant": "#464554",
                    danger: "#EF4444", error: "#ffb4ab",
                    gold: { light: "#fef08a", DEFAULT: "#eab308", dark: "#a16207" }
                },
                fontFamily: { display: ["Playfair Display","serif"], sans: ["Inter","sans-serif"], mono: ["JetBrains Mono","monospace"] }
            }
        }
    };
    </script>
    <style>
        .glass-card {
            background: linear-gradient(135deg, rgba(22,22,22,0.92) 0%, rgba(12,12,12,0.96) 100%);
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 0 80px rgba(192,193,255,0.06), 0 24px 80px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04);
        }
        .gold-glow { box-shadow: 0 0 60px rgba(234,179,8,0.15), 0 4px 24px rgba(0,0,0,0.4); }
        .gold-btn { background: linear-gradient(135deg, #eab308 0%, #a16207 100%); transition: all 0.3s ease; }
        .gold-btn:hover { box-shadow: 0 8px 32px rgba(234,179,8,0.35); transform: translateY(-1px); }
        .gold-btn:active { transform: scale(0.97); }
        .input-field { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); transition: border-color 0.3s, box-shadow 0.3s; }
        .input-field:focus { border-color: rgba(234,179,8,0.5); box-shadow: 0 0 0 3px rgba(234,179,8,0.1); outline: none; }
        .ornate-line { height: 1px; background: linear-gradient(90deg, transparent, rgba(234,179,8,0.3), transparent); }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-up { animation: fadeUp 0.6s ease forwards; }
    </style>
</head>
<body class="bg-surface text-on-surface font-sans min-h-screen flex flex-col items-center justify-center p-4"
      style="background-image: radial-gradient(ellipse at 20% 0%, rgba(192,193,255,0.06) 0%, transparent 50%), radial-gradient(ellipse at 80% 100%, rgba(234,179,8,0.04) 0%, transparent 50%);">

    <div class="w-full max-w-md animate-fade-up">
        <div class="text-center mb-8">
            <div class="inline-flex items-center gap-2 mb-4">
                <span class="material-symbols-outlined text-gold text-3xl" style="font-variation-settings:'FILL' 1;">admin_panel_settings</span>
            </div>
            <h1 class="font-display text-4xl text-on-surface tracking-tight mb-2">Super Admin</h1>
            <div class="ornate-line w-24 mx-auto mb-3"></div>
            <p class="text-text-muted text-sm">Restron Platform Management</p>
        </div>

        <div class="glass-card rounded-2xl p-8 gold-glow">
            <div class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-text-muted uppercase tracking-wider mb-2">Username</label>
                    <input id="u" type="text" placeholder="Enter admin username"
                           class="input-field w-full rounded-xl px-4 py-3 text-on-surface font-sans placeholder:text-text-muted/50">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-text-muted uppercase tracking-wider mb-2">Password</label>
                    <input id="p" type="password" placeholder="Enter admin password"
                           class="input-field w-full rounded-xl px-4 py-3 text-on-surface font-sans placeholder:text-text-muted/50">
                </div>
                <button onclick="login()" class="gold-btn w-full rounded-xl py-3.5 text-black font-bold text-sm uppercase tracking-wider">
                    Access Dashboard
                </button>
                <p id="msg" class="text-danger text-sm text-center min-h-[20px]"></p>
            </div>
        </div>

        <p class="text-center text-text-muted/50 text-xs mt-6">Secured by Restron · Platform Administration</p>
    </div>

    <script>
        async function login() {
            const u = document.getElementById('u').value;
            const p = document.getElementById('p').value;
            const formData = new FormData();
            formData.append('username', u);
            formData.append('password', p);

            try {
                const res = await fetch('/superadmin/token', { method: 'POST', body: formData });
                if (res.ok) {
                    window.location.href = '/superadmin/dashboard';
                } else {
                    const err = await res.json().catch(() => ({ detail: 'Login failed' }));
                    document.getElementById('msg').innerText = err.detail || "Invalid credentials";
                }
            } catch (error) {
                document.getElementById('msg').innerText = "Network error. Please try again.";
            }
        }

        document.getElementById('p').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
