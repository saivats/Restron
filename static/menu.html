<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8">
    <title>Menu — Restron</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="description" content="Browse the restaurant menu — powered by Restron.">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#131313">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Restron">
    <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', {scope: '/'})
        .then(reg => console.log('SW registered'))
        .catch(err => console.log('SW failed:', err));
    }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script>
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    surface: "#0C0C0C", background: "#131313", card: "#161616", elevated: "#1A1A1A",
                    "surface-container": "#201f1f", "surface-bright": "#3a3939",
                    primary: "#c0c1ff", "primary-container": "#8083ff", secondary: "#d0bcff", tertiary: "#4edea3",
                    "on-surface": "#e5e2e1", "on-surface-variant": "#c7c4d7", "text-muted": "#888888",
                    "border-glass": "rgba(255,255,255,0.08)", outline: "#908fa0", "outline-variant": "#464554",
                    danger: "#EF4444", error: "#ffb4ab", warning: "#F59E0B",
                    gold: { light: "#fef08a", DEFAULT: "#eab308", dark: "#a16207" }
                },
                fontFamily: { display: ["Playfair Display","serif"], sans: ["Inter","sans-serif"], mono: ["JetBrains Mono","monospace"] }
            }
        }
    };
    </script>
    <style>
        html { scroll-behavior: smooth; }
        .glass-card { background: linear-gradient(135deg, rgba(22,22,22,0.92) 0%, rgba(12,12,12,0.96) 100%); border: 1px solid rgba(255,255,255,0.06); }
        .gold-btn { background: linear-gradient(135deg, #eab308 0%, #a16207 100%); transition: all 0.3s ease; }
        .gold-btn:hover { box-shadow: 0 8px 32px rgba(234,179,8,0.35); transform: translateY(-1px); }
        .gold-btn:active { transform: scale(0.97); }
        .app-shell { max-width: 720px; margin: 0 auto; padding-bottom: 100px; }
        .menu-header { position: sticky; top: 0; z-index: 30; backdrop-filter: blur(20px); background: rgba(12,12,12,0.85); padding: 16px 16px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .restaurant-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .restaurant-name { font-family: 'Playfair Display', serif; color: #e5e2e1; font-size: 1.4rem; font-weight: 700; }
        .table-badge { background: rgba(234,179,8,0.15); color: #eab308; padding: 4px 14px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid rgba(234,179,8,0.25); }
        .category-nav { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0; scrollbar-width: none; }
        .category-nav::-webkit-scrollbar { display: none; }
        .category-pill { white-space: nowrap; padding: 6px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; background: rgba(255,255,255,0.04); color: #888; text-decoration: none; transition: all 0.2s; border: 1px solid transparent; }
        .category-pill:hover, .category-pill.active { background: rgba(234,179,8,0.12); color: #eab308; border-color: rgba(234,179,8,0.25); }
        .section-title { font-family: 'Playfair Display', serif; color: #eab308; font-size: 1.1rem; font-weight: 700; margin: 24px 16px 12px; }
        .menu-item-row { display: grid; grid-template-columns: 100px 1fr; gap: 14px; padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .food-photo { width: 100px; height: 100px; border-radius: 14px; object-fit: cover; background: #1a1a1a; }
        .photo-placeholder { width: 100px; height: 100px; border-radius: 14px; background: linear-gradient(135deg, #1a1a1a, #222); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 800; color: #333; }
        .item-body { display: flex; flex-direction: column; justify-content: space-between; }
        .item-title-row { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
        .item-name { font-size: 0.95rem; font-weight: 700; color: #e5e2e1; line-height: 1.3; }
        .item-price { color: #eab308; font-weight: 800; font-size: 0.95rem; white-space: nowrap; }
        .item-desc { color: #888; font-size: 0.75rem; margin-top: 4px; line-height: 1.4; }
        .veg-dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; border: 1.5px solid #22C55E; margin-right: 6px; position: relative; top: 0; }
        .veg-dot::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 5px; height: 5px; border-radius: 50%; background: #22C55E; }
        .nonveg-dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; border: 1.5px solid #EF4444; margin-right: 6px; position: relative; top: 0; }
        .nonveg-dot::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 5px; height: 5px; border-radius: 50%; background: #EF4444; }
        .add-btn { background: rgba(234,179,8,0.15); color: #eab308; border: 1px solid rgba(234,179,8,0.3); font-weight: 700; font-size: 13px; padding: 6px 20px; border-radius: 8px; cursor: pointer; transition: all 0.2s; font-family: 'Inter'; }
        .add-btn:hover { background: rgba(234,179,8,0.3); }
        .qty-control { display: flex; align-items: center; gap: 8px; }
        .qty-btn { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-weight: 700; font-size: 16px; cursor: pointer; border: none; transition: all 0.15s; font-family: 'Inter'; background: rgba(234,179,8,0.15); color: #eab308; }
        .qty-btn:active { transform: scale(0.9); }
        .qty-value { font-weight: 700; color: #eab308; font-size: 0.95rem; min-width: 16px; text-align: center; }
        .floating-cart { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; max-width: 720px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; backdrop-filter: blur(20px); background: rgba(22,22,22,0.92); border-top: 1px solid rgba(234,179,8,0.2); }
        .cart-meta { display: flex; flex-direction: column; }
        .cart-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.06em; }
        .floating-cart button { background: linear-gradient(135deg, #eab308 0%, #a16207 100%); color: black; font-weight: 700; padding: 10px 24px; border-radius: 10px; font-size: 14px; border: none; cursor: pointer; font-family: 'Inter'; transition: all 0.2s; }
        .floating-cart button:disabled { opacity: 0.3; cursor: not-allowed; }
        .modal-overlay { position: fixed; inset: 0; z-index: 100; display: none; align-items: flex-end; justify-content: center; background: rgba(8,8,8,0.7); backdrop-filter: blur(6px); }
        .modal-overlay.active { display: flex; }
        .cart-drawer { width: min(100%, 720px); background: #161616; border: 1px solid rgba(255,255,255,0.06); border-radius: 22px 22px 0 0; padding: 22px; box-shadow: 0 -24px 80px rgba(0,0,0,0.6); }
        .drawer-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .drawer-head h2 { color: #e5e2e1; font-family: 'Playfair Display', serif; }
        .cart-summary-line { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.04); color: #c7c4d7; font-size: 0.9rem; }
        .cart-total-line { display: flex; justify-content: space-between; padding: 14px 0; color: #eab308; font-size: 20px; font-weight: 800; }
        .drawer-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: #c7c4d7; padding: 10px 16px; border-radius: 10px; cursor: pointer; font-family: 'Inter'; font-weight: 600; transition: all 0.2s; }
        .btn-outline:hover { border-color: rgba(234,179,8,0.4); color: #eab308; }
        .btn-primary { background: linear-gradient(135deg, #eab308 0%, #a16207 100%); color: black; font-weight: 700; padding: 10px 16px; border-radius: 10px; cursor: pointer; font-family: 'Inter'; border: none; transition: all 0.2s; }
        .empty-state { text-align: center; color: #888; padding: 36px 0; }
        input, select { width: 100%; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 0.75rem; padding: 0.65rem 1rem; font-size: 0.9rem; color: #e5e2e1; font-family: 'Inter', sans-serif; margin-bottom: 0.75rem; transition: border-color 0.3s, box-shadow 0.3s; }
        input:focus { border-color: rgba(234,179,8,0.5); box-shadow: 0 0 0 3px rgba(234,179,8,0.1); outline: none; }
        label { display: block; color: #888; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem; }
        @media (min-width: 640px) {
            .menu-item-row { grid-template-columns: 132px 1fr; }
            .food-photo, .photo-placeholder { width: 132px; height: 132px; }
        }
    </style>
    <script>
    (function() {
      const parts = window.location.pathname.split('/');
      const rIndex = parts.indexOf('r');
      if (rIndex !== -1 && parts[rIndex + 1]) {
        const slug = parts[rIndex + 1];
        const link = document.querySelector('link[rel="manifest"]');
        if (link) link.href = '/r/' + slug + '/manifest.json';
      }
    })();
    </script>
</head>
<body class="bg-surface text-on-surface font-sans min-h-screen" style="background-image: radial-gradient(ellipse at 20% 0%, rgba(192,193,255,0.06) 0%, transparent 50%), radial-gradient(ellipse at 80% 100%, rgba(234,179,8,0.04) 0%, transparent 50%);">

    <div id="offline-banner" style="display:none; position:fixed; top:0; left:0; right:0; z-index:99999; background:#EF4444; color:white; text-align:center; padding:8px; font-size:13px; font-family:'Inter';">
      ⚡ You are offline — orders will sync when connection returns
    </div>

    <div class="app-shell">
        <header class="menu-header">
            <div class="restaurant-row">
                <div>
                    <h1 class="restaurant-name" id="restaurant-name">Restron POS</h1>
                    <div style="color:#888; font-size:13px; margin-top:4px;">Fresh, fast, accurate</div>
                </div>
                <span class="table-badge" id="table-badge">Table</span>
            </div>
            <input type="text" id="search-input" placeholder="Search menu..." oninput="filterMenu()">
            <nav class="category-nav" id="category-nav"></nav>
        </header>

        <main id="menu-container"><p class="empty-state">Loading menu...</p></main>
    </div>

    <div class="floating-cart">
        <div class="cart-meta">
            <span class="cart-label">Your Order</span>
            <strong><span id="total-items">0 Items</span> | <span id="total-price">&#8377;0</span></strong>
        </div>
        <button onclick="openModal()" id="view-cart-btn" disabled>View Cart</button>
    </div>

    <a id="reserve-cta" style="display:none; position:fixed; bottom:90px; right:16px; z-index:40; background:linear-gradient(135deg,#eab308,#a16207); color:black; padding:12px 20px; border-radius:999px; font-family:'Inter',sans-serif; font-weight:700; font-size:0.875rem; text-decoration:none; align-items:center; gap:6px; box-shadow:0 4px 20px rgba(234,179,8,0.35); transition:all 0.2s;" onmouseover="this.style.boxShadow='0 8px 32px rgba(234,179,8,0.5)'" onmouseout="this.style.boxShadow='0 4px 20px rgba(234,179,8,0.35)'">📅 Reserve a Table</a>

    <div id="order-modal" class="modal-overlay">
        <div class="cart-drawer">
            <div class="drawer-head">
                <h2>Confirm Order</h2>
                <button class="btn-outline" onclick="closeModal()">Close</button>
            </div>
            <div id="cart-lines"></div>
            <div class="cart-total-line"><span>Total</span><span id="drawer-total">&#8377;0</span></div>
            <label>Table Number</label>
            <input type="text" id="modal-table" placeholder="Enter no. or D for delivery">
            <label style="margin-top:10px; display:block;">Phone (optional)</label>
            <input type="tel" id="modal-phone" placeholder="For loyalty discounts">
            <div class="drawer-actions">
                <button class="btn-outline" onclick="closeModal()">Cancel</button>
                <button class="btn-primary" onclick="confirmOrder()">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        let userInRange = false;
        let geofenceConfig = { latitude: null, longitude: null, radius_meters: 50 };
        let cart = {};
        let menuItems = [];
        let fuse;

        function extractSlugFromUrl() {
            const match = window.location.pathname.match(/^\/r\/([^/]+)/);
            return match ? match[1] : 'default';
        }

        function getQueryTable() {
            return new URLSearchParams(window.location.search).get('table') || '';
        }

        async function loadGeofenceConfig() {
            const slug = extractSlugFromUrl();
            try {
                const res = await fetch(`/restaurant/geofence/${slug}`);
                if (res.ok) geofenceConfig = await res.json();
            } catch (e) { }
            if (geofenceConfig.latitude == null || geofenceConfig.longitude == null) {
                userInRange = true;
                return;
            }
            checkLocation();
        }

        function checkLocation() {
            if (!navigator.geolocation) {
                userInRange = true;
                return;
            }
            navigator.geolocation.getCurrentPosition((pos) => {
                const radiusKm = (geofenceConfig.geofence_radius_meters || 50) / 1000;
                const dist = getDistanceFromLatLonInKm(pos.coords.latitude, pos.coords.longitude, geofenceConfig.latitude, geofenceConfig.longitude);
                userInRange = dist <= radiusKm;
                if (!userInRange) alert(`You are ${(dist * 1000).toFixed(0)}m away. Ordering is restricted near the restaurant.`);
                updateCartFooter();
            }, () => { userInRange = true; updateCartFooter(); });
        }

        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            var R = 6371;
            var dLat = deg2rad(lat2-lat1);
            var dLon = deg2rad(lon2-lon1);
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }
        function deg2rad(deg) { return deg * (Math.PI/180); }

        async function loadMenu() {
            try {
                const response = await fetch('/menu/?slug=' + encodeURIComponent(extractSlugFromUrl()));
                menuItems = await response.json();
                fuse = new Fuse(menuItems, { keys: ['name', 'category'], threshold: 0.3 });
                document.getElementById('table-badge').innerText = getQueryTable() ? `Table ${getQueryTable()}` : 'Table';
                renderMenu(menuItems);
                await loadGeofenceConfig();
            } catch (error) {
                console.error(error);
                document.getElementById('menu-container').innerHTML = '<p class="empty-state">Could not load the menu.</p>';
            }
        }

        function filterMenu() {
            const query = document.getElementById('search-input').value;
            if (!query) { renderMenu(menuItems); return; }
            const result = fuse.search(query);
            renderMenu(result.map(r => r.item));
        }

        function imageUrl(item) {
            const query = encodeURIComponent(`${item.name},food,indian`);
            return item.image_url || `https://source.unsplash.com/200x200/?${query}`;
        }

        function imageFallback(img, name) {
            const div = document.createElement('div');
            div.className = 'photo-placeholder';
            div.textContent = (name || '?').charAt(0).toUpperCase();
            img.replaceWith(div);
        }

        function renderMenu(itemsToRender) {
            const container = document.getElementById('menu-container');
            const navContainer = document.getElementById('category-nav');
            container.innerHTML = '';
            navContainer.innerHTML = '';
            const availableItems = itemsToRender.filter(item => item.is_available);
            if (availableItems.length === 0) {
                container.innerHTML = '<p class="empty-state">No items match your search.</p>';
                return;
            }
            const categories = {};
            availableItems.forEach(item => {
                if (!categories[item.category]) categories[item.category] = [];
                categories[item.category].push(item);
            });
            Object.entries(categories).forEach(([catName, items], index) => {
                const sectionId = catName.replace(/\s+/g, '-').toLowerCase();
                navContainer.innerHTML += `<a class="category-pill ${index === 0 ? 'active' : ''}" href="#${sectionId}">${catName}</a>`;
                const section = document.createElement('section');
                section.id = sectionId;
                section.innerHTML = `<h2 class="section-title">${catName}</h2>`;
                items.forEach(item => {
                    const qty = cart[item.id] || 0;
                    const buttonHTML = qty === 0
                        ? `<button onclick="updateQty(${item.id}, 1)" class="add-btn">Add</button>`
                        : `<div class="qty-control"><button onclick="updateQty(${item.id}, -1)" class="qty-btn">-</button><span class="qty-value">${qty}</span><button onclick="updateQty(${item.id}, 1)" class="qty-btn">+</button></div>`;
                    section.innerHTML += `
                        <article class="menu-item-row">
                            <img class="food-photo" loading="lazy" src="${imageUrl(item)}" alt="${item.name}" onerror="imageFallback(this, '${String(item.name).replace(/'/g, "\\'")}')" >
                            <div class="item-body">
                                <div class="item-title-row">
                                    <div>
                                        <h3 class="item-name"><span class="${item.is_veg ? 'veg-dot' : 'nonveg-dot'}"></span>${item.name}</h3>
                                    </div>
                                    <div class="item-price">&#8377;${item.price}</div>
                                </div>
                                <p class="item-desc">${item.description || 'Chef selected favourite.'}</p>
                                <div class="item-actions">${buttonHTML}</div>
                            </div>
                        </article>`;
                });
                container.appendChild(section);
            });
        }

        function updateQty(id, change) {
            cart[id] = (cart[id] || 0) + change;
            if (cart[id] <= 0) delete cart[id];
            filterMenu();
            updateCartFooter();
        }

        function updateCartFooter() {
            let totalCount = 0;
            let totalPrice = 0;
            menuItems.forEach(item => {
                const qty = cart[item.id] || 0;
                totalCount += qty;
                totalPrice += item.price * qty;
            });
            document.getElementById('total-items').innerText = `${totalCount} Items`;
            document.getElementById('total-price').innerText = `₹${totalPrice}`;
            const btn = document.getElementById('view-cart-btn');
            btn.disabled = totalCount === 0 || !userInRange;
        }

        function openModal() {
            renderCartLines();
            const table = getQueryTable();
            if (table) document.getElementById('modal-table').value = table;
            document.getElementById('order-modal').classList.add('active');
            setTimeout(() => document.getElementById('modal-table').focus(), 100);
        }
        function closeModal() { document.getElementById('order-modal').classList.remove('active'); }

        function renderCartLines() {
            const lines = [];
            let total = 0;
            menuItems.forEach(item => {
                const qty = cart[item.id] || 0;
                if (!qty) return;
                total += qty * item.price;
                lines.push(`<div class="cart-summary-line"><span>${qty} x ${item.name}</span><strong style="color:#eab308;">₹${qty * item.price}</strong></div>`);
            });
            document.getElementById('cart-lines').innerHTML = lines.join('') || '<p class="empty-state">Your cart is empty.</p>';
            document.getElementById('drawer-total').innerText = `₹${total}`;
        }

        function openRestronDB() {
          return new Promise((resolve, reject) => {
            const req = indexedDB.open('restron-offline', 1);
            req.onupgradeneeded = e => {
              const db = e.target.result;
              if (!db.objectStoreNames.contains('pending_orders'))
                db.createObjectStore('pending_orders', {keyPath: 'id', autoIncrement: true});
              if (!db.objectStoreNames.contains('pending_checkouts'))
                db.createObjectStore('pending_checkouts', {keyPath: 'id', autoIncrement: true});
            };
            req.onsuccess = e => resolve(e.target.result);
            req.onerror = e => reject(e.target.error);
          });
        }

        async function submitOrderWithOfflineSupport(orderData, slug) {
          if (navigator.onLine) {
            return await fetch('/order/?slug=' + encodeURIComponent(slug), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(orderData)
            });
          }
          const db = await openRestronDB();
          await new Promise((resolve, reject) => {
            const tx = db.transaction('pending_orders', 'readwrite');
            tx.objectStore('pending_orders').add({
              slug: slug,
              data: orderData,
              timestamp: Date.now()
            });
            tx.oncomplete = resolve;
            tx.onerror = reject;
          });
          if ('serviceWorker' in navigator && 'SyncManager' in window) {
            const sw = await navigator.serviceWorker.ready;
            await sw.sync.register('sync-orders');
          }
          return {
            ok: true,
            json: async () => ({ message: 'Order queued for sync', offline: true })
          };
        }

        async function confirmOrder() {
            const geofenceActive = geofenceConfig.latitude != null && geofenceConfig.longitude != null;
            const lastOrderTime = localStorage.getItem('lastOrderTime');
            if (geofenceActive && lastOrderTime && (Date.now() - parseInt(lastOrderTime)) / 60000 > 10) {
                checkLocation();
                if (!userInRange) {
                    alert('Please move closer to the restaurant to place a new order.');
                    return;
                }
            }
            const tableInput = document.getElementById('modal-table').value.trim();
            const phoneInput = document.getElementById('modal-phone').value.trim();
            if (!tableInput) { alert('Table number required.'); return; }
            const orderItems = [];
            for (let id in cart) if (cart[id] > 0) orderItems.push({ menu_item_id: parseInt(id), quantity: cart[id] });
            let tableNum = 0;
            let type = 'Dine-in';
            if (tableInput.toLowerCase() === 'd' || tableInput.toLowerCase() === 'delivery') type = 'Delivery';
            else tableNum = parseInt(tableInput) || 0;
            try {
                const response = await submitOrderWithOfflineSupport(
                    { table_number: tableNum, items: orderItems, order_type: type, customer_phone: phoneInput || null },
                    extractSlugFromUrl()
                );
                if (response.ok) {
                    const data = await response.json();
                    const offlineMsg = data.offline
                        ? 'Order saved! It will be sent to the kitchen when connection is restored.'
                        : (type === 'Delivery' ? 'Delivery order placed.' : 'Order placed.');
                    alert(offlineMsg);
                    localStorage.setItem('lastOrderTime', Date.now().toString());
                    cart = {};
                    closeModal();
                    document.getElementById('modal-table').value = '';
                    filterMenu();
                    updateCartFooter();
                } else {
                    const err = await response.json().catch(() => ({ detail: 'Could not place order' }));
                    alert(err.detail || 'Could not place order.');
                }
            } catch (error) {
                alert('Network error.');
            }
        }

        function updateOnlineStatus() {
          const banner = document.getElementById('offline-banner');
          if (banner) banner.style.display = navigator.onLine ? 'none' : 'block';
        }
        window.addEventListener('online', () => {
          updateOnlineStatus();
          if ('serviceWorker' in navigator && 'SyncManager' in window) {
            navigator.serviceWorker.ready.then(sw => {
              sw.sync.register('sync-orders');
            });
          }
        });
        window.addEventListener('offline', updateOnlineStatus);
        document.addEventListener('DOMContentLoaded', updateOnlineStatus);

        async function checkReservations() {
            try {
                const slug = extractSlugFromUrl();
                const res = await fetch(`/reservations/config/${slug}`);
                if (res.ok) {
                    const config = await res.json();
                    if (config.enabled) {
                        const btn = document.getElementById('reserve-cta');
                        if (btn) {
                            btn.href = `/r/${slug}/reserve`;
                            btn.style.display = 'flex';
                        }
                    }
                }
            } catch (e) {}
        }

        loadMenu();
        checkReservations();
    </script>
</body>
</html>
