<!DOCTYPE html>
<html lang="en">
<head>
    <title>Restron Menu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#E8851A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Restron">
    <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', {scope: '/'})
        .then(reg => console.log('SW registered'))
        .catch(err => console.log('SW failed:', err));
    }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0D0A06;
            --bg-surface: #1A1208;
            --bg-card: #221A0E;
            --primary: #E8851A;
            --primary-dark: #C4690E;
            --secondary: #8B1A3A;
            --text-primary: #F5E6D0;
            --text-muted: #9A8070;
            --border: rgba(232, 133, 26, 0.15);
            --glow: rgba(232, 133, 26, 0.08);
            --success: #2D7A4F;
            --danger: #8B1A1A;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: var(--bg-base);
            background-image: radial-gradient(ellipse at top, #2A1A08 0%, #0D0A06 70%);
            color: var(--text-primary);
            font-family: 'DM Sans', sans-serif;
            padding-bottom: 110px;
        }
        h1, h2, h3 { font-family: 'Playfair Display', serif; color: var(--primary); }
        button, .btn {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            transition: all 0.15s ease;
        }
        button:active, .btn:active { transform: scale(0.97); }
        button:disabled { opacity: 0.55; cursor: not-allowed; }
        .btn-primary, .add-btn {
            background: linear-gradient(135deg, #E8851A, #C4690E);
            color: white;
        }
        .btn-primary:hover, .add-btn:hover {
            background: linear-gradient(135deg, #F09030, #D4790E);
            box-shadow: 0 4px 16px rgba(232,133,26,0.4);
        }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        input, select, textarea {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            color: var(--text-primary);
            font-family: 'DM Sans', sans-serif;
            transition: border-color 0.2s ease;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(232,133,26,0.1);
        }
        .app-shell { max-width: 720px; margin: 0 auto; padding: 18px 14px; }
        .menu-header {
            position: sticky;
            top: 0;
            z-index: 20;
            margin: -18px -14px 18px;
            padding: 18px 14px 12px;
            background: rgba(13,10,6,0.92);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
        }
        .restaurant-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
        .restaurant-name { font-size: 31px; line-height: 1; }
        .table-badge, .badge {
            display: inline-flex;
            align-items: center;
            padding: 5px 12px;
            border-radius: 999px;
            border: 1px solid rgba(232,133,26,0.3);
            background: rgba(232,133,26,0.16);
            color: var(--primary);
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }
        .category-nav {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 12px 0 2px;
            scrollbar-width: none;
        }
        .category-nav::-webkit-scrollbar { display: none; }
        .category-pill {
            flex: 0 0 auto;
            text-decoration: none;
            color: var(--text-muted);
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.04);
            border-radius: 999px;
            padding: 9px 14px;
            font-size: 13px;
            font-weight: 700;
        }
        .category-pill.active, .category-pill:hover { background: var(--primary); color: white; border-color: transparent; }
        .section-title { margin: 24px 0 12px; font-size: 24px; }
        #menu-container { display: grid; gap: 12px; }
        .menu-item-row {
            display: grid;
            grid-template-columns: 96px 1fr;
            gap: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 10px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .food-photo, .photo-placeholder {
            width: 96px;
            height: 96px;
            border-radius: 12px;
            object-fit: cover;
            background: linear-gradient(135deg, #E8851A, #8B1A3A);
            color: white;
            display: grid;
            place-items: center;
            font-family: 'Playfair Display', serif;
            font-size: 32px;
        }
        .item-body { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
        .item-title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .item-name { color: var(--text-primary); font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 700; }
        .item-price { color: var(--primary); font-weight: 800; white-space: nowrap; }
        .item-desc { color: var(--text-muted); font-size: 13px; line-height: 1.35; }
        .veg-dot, .nonveg-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 7px; }
        .veg-dot { background: #35A866; }
        .nonveg-dot { background: #D84A4A; }
        .item-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; }
        .qty-control { display: flex; align-items: center; gap: 10px; }
        .qty-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            padding: 0;
            color: white;
            background: var(--primary);
            font-size: 18px;
        }
        .qty-value { min-width: 22px; text-align: center; font-weight: 800; color: var(--primary); }
        .floating-cart {
            position: fixed;
            left: 12px;
            right: 12px;
            bottom: 12px;
            max-width: 700px;
            margin: 0 auto;
            z-index: 30;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border-radius: 18px;
            background: linear-gradient(135deg, #E8851A, #C4690E);
            color: white;
            box-shadow: 0 16px 44px rgba(0,0,0,0.5), 0 6px 24px rgba(232,133,26,0.35);
        }
        .cart-meta { display: flex; flex-direction: column; gap: 2px; }
        .cart-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.75; }
        #view-cart-btn { background: rgba(13,10,6,0.22); color: white; border: 1px solid rgba(255,255,255,0.22); }
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
            align-items: flex-end;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .cart-drawer {
            width: min(100%, 720px);
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 22px 22px 0 0;
            padding: 22px;
            box-shadow: 0 -24px 80px rgba(0,0,0,0.6);
        }
        .drawer-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .cart-summary-line { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .cart-total-line { display: flex; justify-content: space-between; padding: 14px 0; color: var(--primary); font-size: 20px; font-weight: 800; }
        .drawer-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
        .empty-state { text-align: center; color: var(--text-muted); padding: 36px 0; }
        @media (min-width: 640px) {
            .menu-item-row { grid-template-columns: 132px 1fr; }
            .food-photo, .photo-placeholder { width: 132px; height: 132px; }
        }
    </style>
    <script>
    (function() {
      const parts = window.location.pathname.split('/');
      const rIndex = parts.indexOf('r');
      if (rIndex !== -1 && parts[rIndex + 1]) {
        const slug = parts[rIndex + 1];
        const link = document.querySelector('link[rel="manifest"]');
        if (link) link.href = '/r/' + slug + '/manifest.json';
      }
    })();
    </script>
</head>
<body>
    <div id="offline-banner" style="display:none; position:fixed; top:0; left:0; right:0; z-index:99999; background:#8B1A1A; color:white; text-align:center; padding:8px; font-size:13px; font-family:'DM Sans';">
      ⚡ You are offline — orders will sync when connection returns
    </div>
    <div class="app-shell">
        <header class="menu-header">
            <div class="restaurant-row">
                <div>
                    <h1 class="restaurant-name" id="restaurant-name">Restron POS</h1>
                    <div style="color:var(--text-muted); font-size:13px; margin-top:4px;">Fresh, fast, accurate</div>
                </div>
                <span class="table-badge" id="table-badge">Table</span>
            </div>
            <input type="text" id="search-input" placeholder="Search menu..." oninput="filterMenu()">
            <nav class="category-nav" id="category-nav"></nav>
        </header>

        <main id="menu-container"><p class="empty-state">Loading menu...</p></main>
    </div>

    <div class="floating-cart">
        <div class="cart-meta">
            <span class="cart-label">Your Order</span>
            <strong><span id="total-items">0 Items</span> | <span id="total-price">&#8377;0</span></strong>
        </div>
        <button onclick="openModal()" id="view-cart-btn" disabled>View Cart</button>
    </div>

    <div id="order-modal" class="modal-overlay">
        <div class="cart-drawer">
            <div class="drawer-head">
                <h2>Confirm Order</h2>
                <button class="btn-outline" onclick="closeModal()">Close</button>
            </div>
            <div id="cart-lines"></div>
            <div class="cart-total-line"><span>Total</span><span id="drawer-total">&#8377;0</span></div>
            <label>Table Number</label>
            <input type="text" id="modal-table" placeholder="Enter no. or D for delivery">
            <label style="margin-top:10px; display:block;">Phone (optional)</label>
            <input type="tel" id="modal-phone" placeholder="For loyalty discounts">
            <div class="drawer-actions">
                <button class="btn-outline" onclick="closeModal()">Cancel</button>
                <button class="btn-primary" onclick="confirmOrder()">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        let userInRange = false;
        let geofenceConfig = { latitude: null, longitude: null, radius_meters: 50 };
        let cart = {};
        let menuItems = [];
        let fuse;

        function extractSlugFromUrl() {
            const match = window.location.pathname.match(/^\/r\/([^/]+)/);
            return match ? match[1] : 'default';
        }

        function getQueryTable() {
            return new URLSearchParams(window.location.search).get('table') || '';
        }

        async function loadGeofenceConfig() {
            const slug = extractSlugFromUrl();
            try {
                const res = await fetch(`/restaurant/geofence/${slug}`);
                if (res.ok) geofenceConfig = await res.json();
            } catch (e) { }
            if (geofenceConfig.latitude == null || geofenceConfig.longitude == null) {
                userInRange = true;
                return;
            }
            checkLocation();
        }

        function checkLocation() {
            if (!navigator.geolocation) {
                userInRange = true;
                return;
            }
            navigator.geolocation.getCurrentPosition((pos) => {
                const radiusKm = (geofenceConfig.geofence_radius_meters || 50) / 1000;
                const dist = getDistanceFromLatLonInKm(pos.coords.latitude, pos.coords.longitude, geofenceConfig.latitude, geofenceConfig.longitude);
                userInRange = dist <= radiusKm;
                if (!userInRange) alert(`You are ${(dist * 1000).toFixed(0)}m away. Ordering is restricted near the restaurant.`);
                updateCartFooter();
            }, () => { userInRange = true; updateCartFooter(); });
        }

        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            var R = 6371;
            var dLat = deg2rad(lat2-lat1);
            var dLon = deg2rad(lon2-lon1);
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }
        function deg2rad(deg) { return deg * (Math.PI/180); }

        async function loadMenu() {
            try {
                const response = await fetch('/menu/?slug=' + encodeURIComponent(extractSlugFromUrl()));
                menuItems = await response.json();
                fuse = new Fuse(menuItems, { keys: ['name', 'category'], threshold: 0.3 });
                document.getElementById('table-badge').innerText = getQueryTable() ? `Table ${getQueryTable()}` : 'Table';
                renderMenu(menuItems);
                await loadGeofenceConfig();
            } catch (error) {
                console.error(error);
                document.getElementById('menu-container').innerHTML = '<p class="empty-state">Could not load the menu.</p>';
            }
        }

        function filterMenu() {
            const query = document.getElementById('search-input').value;
            if (!query) { renderMenu(menuItems); return; }
            const result = fuse.search(query);
            renderMenu(result.map(r => r.item));
        }

        function imageUrl(item) {
            const query = encodeURIComponent(`${item.name},food,indian`);
            return item.image_url || `https://source.unsplash.com/200x200/?${query}`;
        }

        function imageFallback(img, name) {
            const div = document.createElement('div');
            div.className = 'photo-placeholder';
            div.textContent = (name || '?').charAt(0).toUpperCase();
            img.replaceWith(div);
        }

        function renderMenu(itemsToRender) {
            const container = document.getElementById('menu-container');
            const navContainer = document.getElementById('category-nav');
            container.innerHTML = '';
            navContainer.innerHTML = '';
            const availableItems = itemsToRender.filter(item => item.is_available);
            if (availableItems.length === 0) {
                container.innerHTML = '<p class="empty-state">No items match your search.</p>';
                return;
            }
            const categories = {};
            availableItems.forEach(item => {
                if (!categories[item.category]) categories[item.category] = [];
                categories[item.category].push(item);
            });
            Object.entries(categories).forEach(([catName, items], index) => {
                const sectionId = catName.replace(/\s+/g, '-').toLowerCase();
                navContainer.innerHTML += `<a class="category-pill ${index === 0 ? 'active' : ''}" href="#${sectionId}">${catName}</a>`;
                const section = document.createElement('section');
                section.id = sectionId;
                section.innerHTML = `<h2 class="section-title">${catName}</h2>`;
                items.forEach(item => {
                    const qty = cart[item.id] || 0;
                    const buttonHTML = qty === 0
                        ? `<button onclick="updateQty(${item.id}, 1)" class="add-btn">Add</button>`
                        : `<div class="qty-control"><button onclick="updateQty(${item.id}, -1)" class="qty-btn">-</button><span class="qty-value">${qty}</span><button onclick="updateQty(${item.id}, 1)" class="qty-btn">+</button></div>`;
                    section.innerHTML += `
                        <article class="menu-item-row">
                            <img class="food-photo" loading="lazy" src="${imageUrl(item)}" alt="${item.name}" onerror="imageFallback(this, '${String(item.name).replace(/'/g, "\\'")}')">
                            <div class="item-body">
                                <div class="item-title-row">
                                    <div>
                                        <h3 class="item-name"><span class="${item.is_veg ? 'veg-dot' : 'nonveg-dot'}"></span>${item.name}</h3>
                                    </div>
                                    <div class="item-price">&#8377;${item.price}</div>
                                </div>
                                <p class="item-desc">${item.description || 'Chef selected favourite.'}</p>
                                <div class="item-actions">${buttonHTML}</div>
                            </div>
                        </article>`;
                });
                container.appendChild(section);
            });
        }

        function updateQty(id, change) {
            cart[id] = (cart[id] || 0) + change;
            if (cart[id] <= 0) delete cart[id];
            filterMenu();
            updateCartFooter();
        }

        function updateCartFooter() {
            let totalCount = 0;
            let totalPrice = 0;
            menuItems.forEach(item => {
                const qty = cart[item.id] || 0;
                totalCount += qty;
                totalPrice += item.price * qty;
            });
            document.getElementById('total-items').innerText = `${totalCount} Items`;
            document.getElementById('total-price').innerText = `₹${totalPrice}`;
            const btn = document.getElementById('view-cart-btn');
            btn.disabled = totalCount === 0 || !userInRange;
        }

        function openModal() {
            renderCartLines();
            const table = getQueryTable();
            if (table) document.getElementById('modal-table').value = table;
            document.getElementById('order-modal').classList.add('active');
            setTimeout(() => document.getElementById('modal-table').focus(), 100);
        }
        function closeModal() { document.getElementById('order-modal').classList.remove('active'); }

        function renderCartLines() {
            const lines = [];
            let total = 0;
            menuItems.forEach(item => {
                const qty = cart[item.id] || 0;
                if (!qty) return;
                total += qty * item.price;
                lines.push(`<div class="cart-summary-line"><span>${qty} x ${item.name}</span><strong>₹${qty * item.price}</strong></div>`);
            });
            document.getElementById('cart-lines').innerHTML = lines.join('') || '<p class="empty-state">Your cart is empty.</p>';
            document.getElementById('drawer-total').innerText = `₹${total}`;
        }

        function openRestronDB() {
          return new Promise((resolve, reject) => {
            const req = indexedDB.open('restron-offline', 1);
            req.onupgradeneeded = e => {
              const db = e.target.result;
              if (!db.objectStoreNames.contains('pending_orders'))
                db.createObjectStore('pending_orders', {keyPath: 'id', autoIncrement: true});
              if (!db.objectStoreNames.contains('pending_checkouts'))
                db.createObjectStore('pending_checkouts', {keyPath: 'id', autoIncrement: true});
            };
            req.onsuccess = e => resolve(e.target.result);
            req.onerror = e => reject(e.target.error);
          });
        }

        async function submitOrderWithOfflineSupport(orderData, slug) {
          if (navigator.onLine) {
            return await fetch('/order/?slug=' + encodeURIComponent(slug), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(orderData)
            });
          }
          const db = await openRestronDB();
          await new Promise((resolve, reject) => {
            const tx = db.transaction('pending_orders', 'readwrite');
            tx.objectStore('pending_orders').add({
              slug: slug,
              data: orderData,
              timestamp: Date.now()
            });
            tx.oncomplete = resolve;
            tx.onerror = reject;
          });
          if ('serviceWorker' in navigator && 'SyncManager' in window) {
            const sw = await navigator.serviceWorker.ready;
            await sw.sync.register('sync-orders');
          }
          return {
            ok: true,
            json: async () => ({ message: 'Order queued for sync', offline: true })
          };
        }

        async function confirmOrder() {
            const geofenceActive = geofenceConfig.latitude != null && geofenceConfig.longitude != null;
            const lastOrderTime = localStorage.getItem('lastOrderTime');
            if (geofenceActive && lastOrderTime && (Date.now() - parseInt(lastOrderTime)) / 60000 > 10) {
                checkLocation();
                if (!userInRange) {
                    alert('Please move closer to the restaurant to place a new order.');
                    return;
                }
            }
            const tableInput = document.getElementById('modal-table').value.trim();
            const phoneInput = document.getElementById('modal-phone').value.trim();
            if (!tableInput) { alert('Table number required.'); return; }
            const orderItems = [];
            for (let id in cart) if (cart[id] > 0) orderItems.push({ menu_item_id: parseInt(id), quantity: cart[id] });
            let tableNum = 0;
            let type = 'Dine-in';
            if (tableInput.toLowerCase() === 'd' || tableInput.toLowerCase() === 'delivery') type = 'Delivery';
            else tableNum = parseInt(tableInput) || 0;
            try {
                const response = await submitOrderWithOfflineSupport(
                    { table_number: tableNum, items: orderItems, order_type: type, customer_phone: phoneInput || null },
                    extractSlugFromUrl()
                );
                if (response.ok) {
                    const data = await response.json();
                    const offlineMsg = data.offline
                        ? 'Order saved! It will be sent to the kitchen when connection is restored.'
                        : (type === 'Delivery' ? 'Delivery order placed.' : 'Order placed.');
                    alert(offlineMsg);
                    localStorage.setItem('lastOrderTime', Date.now().toString());
                    cart = {};
                    closeModal();
                    document.getElementById('modal-table').value = '';
                    filterMenu();
                    updateCartFooter();
                } else {
                    const err = await response.json().catch(() => ({ detail: 'Could not place order' }));
                    alert(err.detail || 'Could not place order.');
                }
            } catch (error) {
                alert('Network error.');
            }
        }

        function updateOnlineStatus() {
          const banner = document.getElementById('offline-banner');
          if (banner) banner.style.display = navigator.onLine ? 'none' : 'block';
        }
        window.addEventListener('online', () => {
          updateOnlineStatus();
          if ('serviceWorker' in navigator && 'SyncManager' in window) {
            navigator.serviceWorker.ready.then(sw => {
              sw.sync.register('sync-orders');
            });
          }
        });
        window.addEventListener('offline', updateOnlineStatus);
        document.addEventListener('DOMContentLoaded', updateOnlineStatus);

        loadMenu();
    </script>
</body>
</html>
