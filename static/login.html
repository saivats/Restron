<script>
        function getSlug() {
            const parts = window.location.pathname.split('/');
            if (parts.length >= 3 && parts[1] === 'r') {
                return parts[2];
            }
            return null;
        }

        async function login() {
            const u = document.getElementById('u').value;
            const p = document.getElementById('p').value;
            const slug = getSlug();
            const formData = new FormData();
            formData.append('username', u);
            formData.append('password', p);

            let url = '/auth/token';
            if (slug) {
                url += '?slug=' + encodeURIComponent(slug);
            }

            try {
                const res = await fetch(url, { method: 'POST', body: formData });
                if (res.ok) {
                    const data = await res.json();
                    window.location.href = data.redirect;
                } else {
                    const err = await res.json().catch(() => ({ detail: 'Login failed' }));
                    if (res.status === 403) {
                        document.getElementById('login-box').style.display = 'none';
                        document.getElementById('inactive-box').style.display = 'block';
                    } else {
                        document.getElementById('msg').innerText = err.detail || "Invalid credentials";
                    }
                }
            } catch (error) {
                document.getElementById('msg').innerText = "Network error. Please try again.";
            }
        }

        document.getElementById('p').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });

        // Atmospheric mouse movement effect
        document.addEventListener('mousemove', (e) => {
            const box = document.getElementById('login-box');
            if (box) {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
                box.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            }
        });
    </script>
