<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8">
    <title>Platform Admin — Restron</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Restron superadmin dashboard — manage all restaurants on the platform.">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script>
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    surface: "#0C0C0C", background: "#131313", card: "#161616", elevated: "#1A1A1A",
                    "surface-container": "#201f1f", "surface-bright": "#3a3939",
                    primary: "#c0c1ff", "primary-container": "#8083ff", secondary: "#d0bcff", tertiary: "#4edea3",
                    "on-surface": "#e5e2e1", "on-surface-variant": "#c7c4d7", "text-muted": "#888888",
                    "border-glass": "rgba(255,255,255,0.08)", outline: "#908fa0", "outline-variant": "#464554",
                    danger: "#EF4444", error: "#ffb4ab", warning: "#F59E0B",
                    gold: { light: "#fef08a", DEFAULT: "#eab308", dark: "#a16207" }
                },
                fontFamily: { display: ["Playfair Display","serif"], sans: ["Inter","sans-serif"], mono: ["JetBrains Mono","monospace"] }
            }
        }
    };
    </script>
    <style>
        .glass-card { background: linear-gradient(135deg, rgba(22,22,22,0.92) 0%, rgba(12,12,12,0.96) 100%); border: 1px solid rgba(255,255,255,0.06); box-shadow: 0 8px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04); }
        .gold-btn { background: linear-gradient(135deg, #eab308 0%, #a16207 100%); transition: all 0.3s ease; }
        .gold-btn:hover { box-shadow: 0 8px 32px rgba(234,179,8,0.35); transform: translateY(-1px); }
        .gold-btn:active { transform: scale(0.97); }
        .ornate-line { height: 1px; background: linear-gradient(90deg, transparent, rgba(234,179,8,0.3), transparent); }
        .modal { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; background: rgba(8,8,8,0.85); backdrop-filter: blur(8px); padding: 1rem; }
        .modal-content { background: #161616; border: 1px solid rgba(255,255,255,0.08); border-radius: 1.25rem; padding: 2rem; max-width: 36rem; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .modal-close { position: absolute; right: 1rem; top: 1rem; color: #888; cursor: pointer; font-size: 1.5rem; line-height: 1; transition: color 0.2s; }
        .modal-close:hover { color: #e5e2e1; }
        .badge { padding: 0.2rem 0.65rem; border-radius: 999px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
        .badge-active { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid rgba(34,197,94,0.25); }
        .badge-inactive { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.25); }
        .badge-paid { background: rgba(192,193,255,0.15); color: #c0c1ff; border: 1px solid rgba(192,193,255,0.25); }
        .badge-trial { background: rgba(234,179,8,0.15); color: #fef08a; border: 1px solid rgba(234,179,8,0.25); }
        .badge-free { background: rgba(255,255,255,0.05); color: #888; border: 1px solid rgba(255,255,255,0.08); }
        .btn-small { padding: 0.3rem 0.6rem; font-size: 0.7rem; border-radius: 0.5rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-small:active { transform: scale(0.95); }
        .btn-outline-sm { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: #c7c4d7; }
        .btn-outline-sm:hover { border-color: rgba(234,179,8,0.4); color: #eab308; }
        .btn-danger-sm { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }
        .btn-danger-sm:hover { background: rgba(239,68,68,0.3); }
        .btn-primary-sm { background: rgba(192,193,255,0.15); color: #c0c1ff; border: 1px solid rgba(192,193,255,0.2); }
        .btn-primary-sm:hover { background: rgba(192,193,255,0.3); }
        .stats-panel { background: rgba(0,0,0,0.3); padding: 1rem; border-radius: 0.75rem; border: 1px solid rgba(255,255,255,0.05); margin-top: 1rem; }
        .stat-row { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .stat-row:last-child { border-bottom: none; }
        .stat-label { color: #888; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .stat-value { font-weight: 700; color: #eab308; font-size: 1.1rem; }
        .credentials-box { background: rgba(234,179,8,0.08); border: 1px solid rgba(234,179,8,0.2); border-radius: 12px; padding: 16px; margin-top: 16px; }
        .credentials-box h4 { color: #4edea3; margin-bottom: 8px; }
        .credentials-box code { background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; }
        input, select { width: 100%; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 0.75rem; padding: 0.65rem 1rem; font-size: 0.9rem; color: #e5e2e1; font-family: 'Inter', sans-serif; margin-bottom: 0.75rem; transition: border-color 0.3s, box-shadow 0.3s; }
        input:focus, select:focus { border-color: rgba(234,179,8,0.5); box-shadow: 0 0 0 3px rgba(234,179,8,0.1); outline: none; }
        label { display: block; color: #888; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem; }
        table { width: 100%; border-collapse: collapse; }
        th { padding: 0.65rem 0.75rem; text-align: left; font-size: 0.7rem; color: #888; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid rgba(255,255,255,0.06); }
        td { padding: 0.65rem 0.75rem; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 0.8rem; }
        tr:hover td { background: rgba(234,179,8,0.03); }
        td code { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: #c0c1ff; background: rgba(0,0,0,0.3); padding: 1px 5px; border-radius: 4px; }
    </style>
</head>
<body class="bg-surface text-on-surface font-sans min-h-screen p-4 md:p-8" style="background-image: radial-gradient(ellipse at 20% 0%, rgba(192,193,255,0.06) 0%, transparent 50%), radial-gradient(ellipse at 80% 100%, rgba(234,179,8,0.04) 0%, transparent 50%);">

    <div id="offline-banner" style="display:none; position:fixed; top:0; left:0; right:0; z-index:99999; background:#EF4444; color:white; text-align:center; padding:8px; font-size:13px; font-family:'Inter';">
      ⚡ You are offline — showing cached data
    </div>

    <header class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-8">
        <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-gold text-3xl" style="font-variation-settings:'FILL' 1;">admin_panel_settings</span>
            <div>
                <h1 class="font-display text-2xl md:text-3xl text-on-surface">Platform Admin</h1>
                <p class="text-text-muted text-xs">Restron Management Console</p>
            </div>
        </div>
        <div class="flex gap-2 flex-wrap">
            <button class="gold-btn px-5 py-2.5 rounded-lg text-black font-bold text-sm" onclick="openCreateModal()">
                <span class="material-symbols-outlined text-sm align-middle mr-1">add</span>New Restaurant
            </button>
            <button class="border border-border-glass text-text-muted hover:text-danger hover:border-danger rounded-lg px-4 py-2.5 text-sm font-semibold transition-all" onclick="logout()">Logout</button>
        </div>
    </header>

    <div class="glass-card rounded-2xl p-6 mb-6 overflow-x-auto">
        <h2 class="text-lg font-bold text-on-surface mb-4 flex items-center gap-2">
            <span class="material-symbols-outlined text-gold">storefront</span> Restaurants
        </h2>
        <table>
            <thead>
                <tr><th>ID</th><th>Name</th><th>Slug</th><th>Owner</th><th>Plan</th><th>Status</th><th>Orders (30d)</th><th>Actions</th></tr>
            </thead>
            <tbody id="restaurant-table">
                <tr><td colspan="8" class="text-text-muted text-center py-8">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <div id="stats-container" class="glass-card rounded-2xl p-6 mb-6" style="display:none;">
        <h2 id="stats-title" class="text-lg font-bold text-on-surface mb-2 flex items-center gap-2">
            <span class="material-symbols-outlined text-gold">analytics</span> Restaurant Stats
        </h2>
        <div class="stats-panel" id="stats-panel"></div>
    </div>

    <div id="create-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeCreateModal()">&times;</span>
            <h2 class="text-xl font-bold text-gold mb-5">Create Restaurant</h2>
            <label>Restaurant Name *</label>
            <input id="cr-name" placeholder="e.g. Desi Zaika">
            <label>Slug * (URL-safe, lowercase)</label>
            <input id="cr-slug" placeholder="e.g. desi-zaika">
            <label>Owner Username *</label>
            <input id="cr-owner" placeholder="e.g. owner_desi">
            <label>Owner Password (leave blank to auto-generate)</label>
            <input id="cr-password" type="password" placeholder="Auto-generated if empty">
            <label>Address</label>
            <input id="cr-address" placeholder="Full address">
            <label>Phone</label>
            <input id="cr-phone" placeholder="Phone number">
            <label>Table Count</label>
            <input id="cr-tables" type="number" value="10">
            <label>Plan</label>
            <select id="cr-plan">
                <option value="trial">Trial</option>
                <option value="starter">Starter</option>
                <option value="growth">Growth</option>
                <option value="pro">Pro</option>
            </select>
            <button class="gold-btn w-full py-3 rounded-xl text-black font-bold text-sm mt-2" onclick="createRestaurant()">Create Restaurant</button>
            <div id="create-result" style="display:none;"></div>
        </div>
    </div>

    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeEditModal()">&times;</span>
            <h2 class="text-xl font-bold text-gold mb-5">Edit Restaurant</h2>
            <input type="hidden" id="edit-id">
            <label>Status</label>
            <select id="edit-active"><option value="true">Active</option><option value="false">Inactive</option></select>
            <label>Plan</label>
            <select id="edit-plan"><option value="trial">Trial</option><option value="starter">Starter</option><option value="growth">Growth</option><option value="pro">Pro</option></select>
            <label>Plan Expires At (ISO date, leave blank for no expiry)</label>
            <input id="edit-expires" type="date" placeholder="YYYY-MM-DD">
            <label>Table Count</label>
            <input id="edit-tables" type="number" min="1">
            <button class="gold-btn w-full py-3 rounded-xl text-black font-bold text-sm mt-2" onclick="saveEdit()">Save Changes</button>
        </div>
    </div>

    <div id="reset-modal" class="modal">
        <div class="modal-content" style="max-width:400px;">
            <span class="modal-close" onclick="closeResetModal()">&times;</span>
            <h2 class="text-xl font-bold text-gold mb-5">Reset Owner Password</h2>
            <input type="hidden" id="reset-restaurant-id">
            <p class="mb-4 text-text-muted text-sm">Owner: <strong class="text-on-surface" id="reset-username-display"></strong></p>
            <label>New Password</label>
            <input id="reset-new-password" type="password" placeholder="Enter new password">
            <button class="gold-btn w-full py-3 rounded-xl text-black font-bold text-sm mt-2" onclick="submitResetPassword()">Reset Password</button>
        </div>
    </div>

    <script>
        async function loadRestaurants() {
            const res = await fetch('/superadmin/restaurants/');
            if (res.status === 401) {
                window.location.href = '/superadmin/login';
                return;
            }
            const data = await res.json();
            const tbody = document.getElementById('restaurant-table');

            if (!data.length) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-text-muted text-center py-8">No restaurants yet. Create one!</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            data.forEach(r => {
                const planBadge = r.plan === 'trial' ? 'badge-trial' : r.plan === 'free' ? 'badge-free' : 'badge-paid';
                const statusBadge = r.is_active ? 'badge-active' : 'badge-inactive';
                tbody.innerHTML += `
                    <tr>
                        <td>${r.id}</td>
                        <td><strong>${r.name}</strong></td>
                        <td><code>${r.slug || '-'}</code></td>
                        <td>${r.owner_username || '-'}</td>
                        <td><span class="badge ${planBadge}">${r.plan || 'free'}</span></td>
                        <td><span class="badge ${statusBadge}">${r.is_active ? 'Active' : 'Inactive'}</span></td>
                        <td>${r.order_count_30d}</td>
                        <td>
                            <div class="flex flex-wrap gap-1">
                                <button class="btn-small btn-outline-sm" onclick="viewStats(${r.id})">Stats</button>
                                <button class="btn-small btn-outline-sm" onclick="editRestaurant(${r.id}, ${r.is_active}, '${r.plan || 'trial'}', '${r.plan_expires_at || ''}', ${r.table_count || 10})">Edit</button>
                                <button class="btn-small btn-outline-sm" onclick="copyCredentials('${r.name}', '${r.slug}', '${r.owner_username || ''}')">Copy</button>
                                <button class="btn-small btn-outline-sm" onclick="openResetModal(${r.id}, '${r.owner_username || ''}')">Reset Pwd</button>
                                ${r.is_active
                                    ? `<button class="btn-small btn-danger-sm" onclick="toggleActive(${r.id}, false)">Deactivate</button>`
                                    : `<button class="btn-small btn-primary-sm" onclick="toggleActive(${r.id}, true)">Activate</button>`
                                }
                            </div>
                        </td>
                    </tr>
                `;
            });
        }

        function openCreateModal() {
            document.getElementById('create-modal').style.display = 'flex';
            document.getElementById('create-result').style.display = 'none';
        }

        function closeCreateModal() {
            document.getElementById('create-modal').style.display = 'none';
        }

        async function createRestaurant() {
            const payload = {
                restaurant_name: document.getElementById('cr-name').value,
                slug: document.getElementById('cr-slug').value.toLowerCase().replace(/\s+/g, '-'),
                owner_username: document.getElementById('cr-owner').value,
                owner_password: document.getElementById('cr-password').value || '',
                address: document.getElementById('cr-address').value,
                phone: document.getElementById('cr-phone').value,
                table_count: parseInt(document.getElementById('cr-tables').value) || 10,
                plan: document.getElementById('cr-plan').value,
            };

            if (!payload.restaurant_name || !payload.slug || !payload.owner_username) {
                alert('Restaurant name, slug, and owner username are required!');
                return;
            }

            const res = await fetch('/superadmin/restaurants/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (res.ok) {
                const resultDiv = document.getElementById('create-result');
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `
                    <div class="credentials-box">
                        <h4>✅ Restaurant Created!</h4>
                        <p style="color:#e5e2e1; margin:6px 0;">Login URL: <code>/r/${data.restaurant.slug}/login</code></p>
                        <p style="color:#e5e2e1; margin:6px 0;">Owner Username: <code>${data.owner.username}</code></p>
                        <p style="color:#e5e2e1; margin:6px 0;">Owner Password: <code>${data.owner.password}</code></p>
                        <p style="color:#fef08a; font-size:0.8rem; margin-top:10px;">⚠️ Save these credentials — the password cannot be recovered.</p>
                    </div>
                `;
                loadRestaurants();
            } else {
                alert(data.detail || 'Failed to create restaurant');
            }
        }

        async function toggleActive(restaurantId, activate) {
            const action = activate ? 'activate' : 'deactivate';
            if (!confirm(`Are you sure you want to ${action} this restaurant?`)) return;

            const res = await fetch(`/superadmin/restaurants/${restaurantId}`, {
                method: 'PATCH',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ is_active: activate })
            });
            if (res.ok) loadRestaurants();
            else alert('Failed to update restaurant');
        }

        async function viewStats(restaurantId) {
            try {
                const res = await fetch(`/superadmin/restaurants/${restaurantId}/stats`, { credentials: 'include' });
                if (!res.ok) { alert('Failed to load stats: ' + res.status); return; }
                const data = await res.json();
                const container = document.getElementById('stats-container');
                container.style.display = 'block';
                document.getElementById('stats-title').innerHTML = `<span class="material-symbols-outlined text-gold align-middle mr-1">analytics</span> ${data.name} — Stats`;
                document.getElementById('stats-panel').innerHTML = `
                    <div class="stat-row"><span class="stat-label">Total Orders</span><span class="stat-value">${data.order_count}</span></div>
                    <div class="stat-row"><span class="stat-label">Total Revenue</span><span class="stat-value">₹${data.revenue_total}</span></div>
                    <div class="stat-row"><span class="stat-label">Last Activity</span><span class="stat-value">${data.last_activity ? new Date(data.last_activity).toLocaleString() : 'No activity'}</span></div>
                `;
                container.scrollIntoView({ behavior: 'smooth' });
            } catch (err) {
                alert('Network error loading stats: ' + err.message);
            }
        }

        function editRestaurant(id, isActive, plan, expiresAt, tableCount) {
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-active').value = String(isActive);
            document.getElementById('edit-plan').value = plan;
            document.getElementById('edit-expires').value = expiresAt ? expiresAt.split('T')[0] : '';
            document.getElementById('edit-tables').value = tableCount;
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('edit-modal').style.display = 'none';
        }

        async function saveEdit() {
            const id = document.getElementById('edit-id').value;
            const payload = {
                is_active: document.getElementById('edit-active').value === 'true',
                plan: document.getElementById('edit-plan').value,
                plan_set_by: 'superadmin',
                table_count: parseInt(document.getElementById('edit-tables').value) || 10,
            };
            const expiresVal = document.getElementById('edit-expires').value;
            if (expiresVal) {
                payload.plan_expires_at = expiresVal + 'T23:59:59';
            } else {
                payload.plan_expires_at = null;
            }

            const res = await fetch(`/superadmin/restaurants/${id}`, {
                method: 'PATCH',
                headers: {'Content-Type': 'application/json'},
                credentials: 'include',
                body: JSON.stringify(payload)
            });
            if (res.ok) {
                alert('Restaurant updated successfully!');
                closeEditModal();
                loadRestaurants();
            } else {
                const err = await res.json().catch(() => ({ detail: 'Unknown error' }));
                alert('Failed: ' + (err.detail || 'Unknown error'));
            }
        }

        async function logout() {
            await fetch('/superadmin/logout', { method: 'POST' });
            window.location.href = '/superadmin/login';
        }

        function copyCredentials(name, slug, ownerUsername) {
            const loginUrl = window.location.origin + '/r/' + slug + '/login';
            const text = 'Restaurant: ' + name + '\nLogin URL: ' + loginUrl + '\nOwner Username: ' + ownerUsername;
            navigator.clipboard.writeText(text).then(() => {
                alert('Credentials copied to clipboard!');
            }).catch(() => {
                prompt('Copy these credentials:', text);
            });
        }

        function openResetModal(restaurantId, ownerUsername) {
            document.getElementById('reset-restaurant-id').value = restaurantId;
            document.getElementById('reset-username-display').innerText = ownerUsername || 'Unknown';
            document.getElementById('reset-new-password').value = '';
            document.getElementById('reset-modal').style.display = 'flex';
        }

        function closeResetModal() {
            document.getElementById('reset-modal').style.display = 'none';
        }

        async function submitResetPassword() {
            const id = document.getElementById('reset-restaurant-id').value;
            const newPassword = document.getElementById('reset-new-password').value;
            if (!newPassword || newPassword.length < 4) {
                alert('Password must be at least 4 characters');
                return;
            }
            const res = await fetch('/superadmin/restaurants/' + id + '/reset-password', {
                method: 'PATCH',
                headers: {'Content-Type': 'application/json'},
                credentials: 'include',
                body: JSON.stringify({ new_password: newPassword })
            });
            const data = await res.json();
            if (res.ok) {
                alert('Password reset for ' + data.username);
                closeResetModal();
            } else {
                alert('Failed: ' + (data.detail || 'Unknown error'));
            }
        }

        loadRestaurants();

        function updateOnlineStatus() {
          const banner = document.getElementById('offline-banner');
          if (banner) banner.style.display = navigator.onLine ? 'none' : 'block';
        }
        window.addEventListener('online', () => {
          updateOnlineStatus();
          loadRestaurants();
        });
        window.addEventListener('offline', updateOnlineStatus);
        document.addEventListener('DOMContentLoaded', updateOnlineStatus);
    </script>
</body>
</html>
