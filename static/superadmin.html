<!DOCTYPE html>
<html>
<head>
    <title>Restron Super Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              background: "#0D0A06",
              surface: "#1A1510",
              primary: "#E8851A",
              secondary: "#8B1A3A",
              success: "#2E7D32",
              error: "#93000a",
              "text-primary": "#F5EBE1",
              "text-secondary": "#A89F95"
            },
            fontFamily: {
              sans: ["DM Sans", "sans-serif"],
              serif: ["Playfair Display", "serif"]
            }
          }
        }
      }
    </script>
    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-background text-text-primary font-sans min-h-screen p-4 md:p-8;
                background-image: radial-gradient(circle at 50% -20%, rgba(232, 133, 26, 0.15) 0%, transparent 60%);
            }
            h1, h2, h3, h4, h5, h6 {
                @apply font-serif text-primary mb-4;
            }
            h1 { @apply text-3xl font-bold; }
            h2 { @apply text-2xl font-semibold; }
            h3 { @apply text-xl font-medium; }
            p { @apply text-text-secondary mb-4; }
            
            input, select, textarea {
                @apply w-full bg-surface border border-white/10 rounded-xl px-4 py-3 text-base focus:ring-primary focus:border-primary transition-all text-text-primary mb-4;
            }
            label {
                @apply block text-text-secondary text-sm font-semibold uppercase tracking-wider mb-1;
            }
            table { @apply w-full text-left border-collapse mb-6; }
            th { @apply px-4 py-3 bg-white/5 text-xs text-white/50 uppercase tracking-wider border-b border-white/10; }
            td { @apply px-4 py-3 border-b border-white/5 text-sm; }
            tr:hover { @apply bg-white/5 transition-colors; }
            
            /* Login page forms */
            .login-container, .form-container {
                @apply bg-surface/80 backdrop-blur-md border border-white/10 rounded-2xl p-8 max-w-md mx-auto shadow-[0_20px_50px_rgba(0,0,0,0.5)] relative overflow-hidden;
            }
            .form-group { @apply mb-4; }
        }
        
        @layer components {
            .header { @apply flex flex-col md:flex-row justify-between items-center mb-8 gap-4; }
            .header-actions { @apply flex gap-2 flex-wrap justify-center; }
            
            .card, .menu-item, .order-card {
                @apply bg-surface/80 backdrop-blur-md border border-white/10 rounded-2xl p-6 shadow-[0_4px_30px_rgba(232,133,26,0.05)] mb-6 relative overflow-hidden transition-all duration-300;
            }
            .card:hover, .menu-item:hover, .order-card:hover {
                @apply shadow-[0_8px_40px_rgba(232,133,26,0.15)] border-primary/20 transform -translate-y-1;
            }
            
            button, .btn {
                @apply font-semibold transition-all duration-300 ease-out active:scale-95 px-6 py-2 rounded-xl inline-flex items-center justify-center gap-2 cursor-pointer;
            }
            .btn-primary, button[type="submit"], button[onclick*="login"], button[onclick*="generate"] {
                @apply bg-primary text-[#4c2700] hover:bg-[#ffb77b] shadow-lg shadow-primary/20 border-0;
            }
            .btn-danger {
                @apply bg-error text-[#ffdad6] hover:bg-[#ffb4ab] hover:text-[#690005] border-0;
            }
            .btn-outline, .btn-secondary {
                @apply bg-transparent border border-primary text-primary hover:bg-primary/10;
            }
            .btn-small {
                @apply px-3 py-1.5 text-xs rounded-lg;
            }
            .btn-success {
                @apply bg-success text-white hover:bg-green-600 border-0;
            }
            
            .modal {
                @apply fixed inset-0 z-[100] hidden items-center justify-center bg-background/80 backdrop-blur-sm p-4;
            }
            .modal-content {
                @apply bg-surface/95 backdrop-blur-md w-full max-w-2xl rounded-2xl p-8 border border-white/10 shadow-2xl relative max-h-[90vh] overflow-y-auto m-auto mt-10;
            }
            .modal-close {
                @apply absolute right-4 top-4 text-white/50 hover:text-white cursor-pointer text-2xl;
            }
            
            .badge {
                @apply px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider border inline-block;
            }
            .badge-active { @apply bg-success/20 text-green-400 border-success/30; }
            .badge-inactive { @apply bg-error/20 text-red-400 border-error/30; }
            .badge-paid, .badge-premium, .status-paid, .status-ready { @apply bg-primary/20 text-primary border-primary/30; }
            .badge-trial, .status-pending, .status-preparing { @apply bg-yellow-900/30 text-yellow-400 border-yellow-500/30; }
            .badge-free { @apply bg-white/5 text-text-secondary border-white/10; }
            .status-delivered { @apply bg-success/20 text-green-400 border-success/30; }
            
            .stats-panel, .credentials-box, .order-details, .items-list {
                @apply bg-black/30 p-4 rounded-xl border border-white/5 mt-4;
            }
            .stat-row {
                @apply flex justify-between py-2 border-b border-white/5 last:border-0;
            }
            .stat-label { @apply text-text-secondary text-sm uppercase tracking-wider; }
            .stat-value { @apply font-bold text-primary text-lg; }
            
            /* Tabs */
            .tabs, .tab-bar { @apply flex overflow-x-auto border-b border-white/10 mb-6 pb-2 gap-4 hide-scrollbar; }
            .tab { @apply px-4 py-2 cursor-pointer text-text-secondary hover:text-white border-b-2 border-transparent transition-colors whitespace-nowrap; }
            .tab.active { @apply text-primary border-primary; }
            .tab-content { @apply hidden; }
            .tab-content.active { @apply block; }
            
            /* Grid layouts */
            #orders-container, #menu-container, #staff-list, .grid-cards {
                @apply grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6;
            }
            
            /* Modifiers & Items */
            .item-row { @apply flex justify-between items-center py-2 border-b border-white/5 last:border-0; }
            .modifier-group { @apply bg-black/20 p-3 rounded-lg border border-white/5 mb-3; }
            
            /* Kitchen/Waiter specific */
            .order-card h3 { @apply flex justify-between items-center text-xl mb-4 border-b border-white/10 pb-2; }
            .order-items { @apply space-y-2 mb-4; }
            .order-item { @apply flex justify-between text-sm p-2 bg-white/5 rounded-lg; }
            
            /* Hide scrollbar for tabs */
            .hide-scrollbar::-webkit-scrollbar { display: none; }
            .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏢 Restron Platform Admin</h1>
        <div class="header-actions">
            <button class="btn-primary" onclick="openCreateModal()">+ New Restaurant</button>
            <button class="btn-outline" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="card">
        <h2>📋 Restaurants</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Slug</th>
                    <th>Plan</th>
                    <th>Status</th>
                    <th>Orders (30d)</th>
                    <th>Tables</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="restaurant-table">
                <tr><td colspan="8" style="color:#666;">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <div id="stats-container" class="card" style="display:none;">
        <h2 id="stats-title">📊 Restaurant Stats</h2>
        <div class="stats-panel" id="stats-panel"></div>
    </div>

    <div id="create-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeCreateModal()">&times;</span>
            <h2 style="color:#a29bfe; margin-bottom:20px;">Create Restaurant</h2>
            <label>Restaurant Name *</label>
            <input id="cr-name" placeholder="e.g. Desi Zaika">
            <label>Slug * (URL-safe, lowercase)</label>
            <input id="cr-slug" placeholder="e.g. desi-zaika">
            <label>Owner Username *</label>
            <input id="cr-owner" placeholder="e.g. owner_desi">
            <label>Owner Password (leave blank to auto-generate)</label>
            <input id="cr-password" type="password" placeholder="Auto-generated if empty">
            <label>Address</label>
            <input id="cr-address" placeholder="Full address">
            <label>Phone</label>
            <input id="cr-phone" placeholder="Phone number">
            <label>Table Count</label>
            <input id="cr-tables" type="number" value="10">
            <label>Plan</label>
            <select id="cr-plan">
                <option value="trial">Trial</option>
                <option value="basic">Basic</option>
                <option value="premium">Premium</option>
            </select>
            <button class="btn-primary" onclick="createRestaurant()" style="width:100%; margin-top:10px;">Create Restaurant</button>
            <div id="create-result" style="display:none;"></div>
        </div>
    </div>

    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeEditModal()">&times;</span>
            <h2 style="color:#a29bfe; margin-bottom:20px;">Edit Restaurant</h2>
            <input type="hidden" id="edit-id">
            <label>Status</label>
            <select id="edit-active">
                <option value="true">Active</option>
                <option value="false">Inactive</option>
            </select>
            <label>Plan</label>
            <select id="edit-plan">
                <option value="trial">Trial</option>
                <option value="basic">Basic</option>
                <option value="premium">Premium</option>
                <option value="free">Free</option>
            </select>
            <label>Plan Expires At (ISO date, leave blank for no expiry)</label>
            <input id="edit-expires" type="date" placeholder="YYYY-MM-DD">
            <label>Table Count</label>
            <input id="edit-tables" type="number" min="1">
            <button class="btn-primary" onclick="saveEdit()" style="width:100%; margin-top:10px;">Save Changes</button>
        </div>
    </div>

    <script>
        async function loadRestaurants() {
            const res = await fetch('/superadmin/restaurants/');
            if (res.status === 401) {
                window.location.href = '/superadmin/login';
                return;
            }
            const data = await res.json();
            const tbody = document.getElementById('restaurant-table');

            if (!data.length) {
                tbody.innerHTML = '<tr><td colspan="8" style="color:#666;">No restaurants yet. Create one!</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            data.forEach(r => {
                const planBadge = r.plan === 'trial' ? 'badge-trial' : r.plan === 'free' ? 'badge-free' : 'badge-paid';
                const statusBadge = r.is_active ? 'badge-active' : 'badge-inactive';
                tbody.innerHTML += `
                    <tr>
                        <td>${r.id}</td>
                        <td><strong>${r.name}</strong></td>
                        <td><code>${r.slug || '-'}</code></td>
                        <td><span class="badge ${planBadge}">${r.plan || 'free'}</span></td>
                        <td><span class="badge ${statusBadge}">${r.is_active ? 'Active' : 'Inactive'}</span></td>
                        <td>${r.order_count_30d}</td>
                        <td>${r.table_count || '-'}</td>
                        <td>
                            <button class="btn-small btn-outline" onclick="viewStats(${r.id})">Stats</button>
                            <button class="btn-small btn-outline" onclick="editRestaurant(${r.id}, ${r.is_active}, '${r.plan || 'free'}', '${r.plan_expires_at || ''}', ${r.table_count || 10})">Edit</button>
                            ${r.is_active
                                ? `<button class="btn-small btn-danger" onclick="toggleActive(${r.id}, false)">Deactivate</button>`
                                : `<button class="btn-small btn-primary" onclick="toggleActive(${r.id}, true)">Activate</button>`
                            }
                        </td>
                    </tr>
                `;
            });
        }

        function openCreateModal() {
            document.getElementById('create-modal').style.display = 'block';
            document.getElementById('create-result').style.display = 'none';
        }

        function closeCreateModal() {
            document.getElementById('create-modal').style.display = 'none';
        }

        async function createRestaurant() {
            const payload = {
                restaurant_name: document.getElementById('cr-name').value,
                slug: document.getElementById('cr-slug').value.toLowerCase().replace(/\s+/g, '-'),
                owner_username: document.getElementById('cr-owner').value,
                owner_password: document.getElementById('cr-password').value || '',
                address: document.getElementById('cr-address').value,
                phone: document.getElementById('cr-phone').value,
                table_count: parseInt(document.getElementById('cr-tables').value) || 10,
                plan: document.getElementById('cr-plan').value,
            };

            if (!payload.restaurant_name || !payload.slug || !payload.owner_username) {
                alert('Restaurant name, slug, and owner username are required!');
                return;
            }

            const res = await fetch('/superadmin/restaurants/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (res.ok) {
                const resultDiv = document.getElementById('create-result');
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `
                    <div class="credentials-box">
                        <h4>✅ Restaurant Created!</h4>
                        <p>Login URL: <code>/r/${data.restaurant.slug}/login</code></p>
                        <p>Owner Username: <code>${data.owner.username}</code></p>
                        <p>Owner Password: <code>${data.owner.password}</code></p>
                        <p style="color:#fdcb6e; font-size:0.85em; margin-top:10px;">⚠️ Save these credentials — the password cannot be recovered.</p>
                    </div>
                `;
                loadRestaurants();
            } else {
                alert(data.detail || 'Failed to create restaurant');
            }
        }

        async function toggleActive(restaurantId, activate) {
            const action = activate ? 'activate' : 'deactivate';
            if (!confirm(`Are you sure you want to ${action} this restaurant?`)) return;

            const res = await fetch(`/superadmin/restaurants/${restaurantId}`, {
                method: 'PATCH',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ is_active: activate })
            });
            if (res.ok) loadRestaurants();
            else alert('Failed to update restaurant');
        }

        async function viewStats(restaurantId) {
            try {
                const res = await fetch(`/superadmin/restaurants/${restaurantId}/stats`, { credentials: 'include' });
                if (!res.ok) { alert('Failed to load stats: ' + res.status); return; }
                const data = await res.json();
                const container = document.getElementById('stats-container');
                container.style.display = 'block';
                document.getElementById('stats-title').innerText = `📊 ${data.name} — Stats`;
                document.getElementById('stats-panel').innerHTML = `
                    <div class="stat-row"><span class="stat-label">Total Orders</span><span class="stat-value">${data.order_count}</span></div>
                    <div class="stat-row"><span class="stat-label">Total Revenue</span><span class="stat-value">₹${data.revenue_total}</span></div>
                    <div class="stat-row"><span class="stat-label">Last Activity</span><span class="stat-value">${data.last_activity ? new Date(data.last_activity).toLocaleString() : 'No activity'}</span></div>
                `;
                container.scrollIntoView({ behavior: 'smooth' });
            } catch (err) {
                alert('Network error loading stats: ' + err.message);
            }
        }

        function editRestaurant(id, isActive, plan, expiresAt, tableCount) {
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-active').value = String(isActive);
            document.getElementById('edit-plan').value = plan;
            document.getElementById('edit-expires').value = expiresAt ? expiresAt.split('T')[0] : '';
            document.getElementById('edit-tables').value = tableCount;
            document.getElementById('edit-modal').style.display = 'block';
        }

        function closeEditModal() {
            document.getElementById('edit-modal').style.display = 'none';
        }

        async function saveEdit() {
            const id = document.getElementById('edit-id').value;
            const payload = {
                is_active: document.getElementById('edit-active').value === 'true',
                plan: document.getElementById('edit-plan').value,
                table_count: parseInt(document.getElementById('edit-tables').value) || 10,
            };
            const expiresVal = document.getElementById('edit-expires').value;
            if (expiresVal) {
                payload.plan_expires_at = expiresVal + 'T23:59:59';
            } else {
                payload.plan_expires_at = null;
            }

            const res = await fetch(`/superadmin/restaurants/${id}`, {
                method: 'PATCH',
                headers: {'Content-Type': 'application/json'},
                credentials: 'include',
                body: JSON.stringify(payload)
            });
            if (res.ok) {
                alert('Restaurant updated successfully!');
                closeEditModal();
                loadRestaurants();
            } else {
                const err = await res.json().catch(() => ({ detail: 'Unknown error' }));
                alert('Failed: ' + (err.detail || 'Unknown error'));
            }
        }

        async function logout() {
            await fetch('/superadmin/logout', { method: 'POST' });
            window.location.href = '/superadmin/login';
        }

        loadRestaurants();
    </script>
</body>
</html>
