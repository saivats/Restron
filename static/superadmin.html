<!DOCTYPE html>
<html>
<head>
    <title>Restron Super Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#6366F1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Restron">
    <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', {scope: '/'})
        .then(reg => console.log('SW registered'))
        .catch(err => console.log('SW failed:', err));
    }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #080808;
            --bg-surface: #111111;
            --bg-card: #161616;
            --primary: #6366F1;
            --primary-dark: #4F46E5;
            --secondary: #8B5CF6;
            --text-primary: #F0F0F0;
            --text-muted: #888888;
            --border: rgba(99, 102, 241, 0.15);
            --glow: rgba(99, 102, 241, 0.08);
            --success: #22C55E;
            --danger: #EF4444;
            --bg-color: #080808;
            --surface-color: rgba(17, 17, 17, 0.8);
            --primary-color: #6366F1;
            --secondary-color: #8B5CF6;
            --success-color: #22C55E;
            --error-color: #EF4444;
            --text-primary: #F0F0F0;
            --text-secondary: #888888;
            --border-color: rgba(255, 255, 255, 0.1);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-color) !important;
            color: var(--text-primary) !important;
            font-family: 'Inter', sans-serif !important;
            min-height: 100vh;
            padding: 1rem;
            background-image: radial-gradient(ellipse at 20% 0%, rgba(99,102,241,0.08) 0%, transparent 50%), radial-gradient(ellipse at 80% 100%, rgba(139,92,246,0.06) 0%, transparent 50%) !important;
        }
        @media (min-width: 768px) { body { padding: 2rem; } }
        
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Inter', serif !important;
            color: var(--primary-color) !important;
            margin-bottom: 1rem;
        }
        
        h1 { font-size: 1.875rem !important; font-weight: 700; }
        h2 { font-size: 1.5rem !important; font-weight: 600; }
        h3 { font-size: 1.25rem !important; font-weight: 500; }
        
        p { color: var(--text-secondary); margin-bottom: 1rem; }
        
        input, select, textarea {
            width: 100%;
            background-color: #1A1510;
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            color: var(--text-primary);
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }
        
        label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }
        
        table { width: 100%; text-align: left; border-collapse: collapse; margin-bottom: 1.5rem; }
        th { 
            padding: 0.75rem 1rem; 
            background-color: rgba(255, 255, 255, 0.05); 
            font-size: 0.75rem; 
            color: rgba(255, 255, 255, 0.5); 
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
            border-bottom: 1px solid var(--border-color); 
        }
        td { padding: 0.75rem 1rem; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.875rem; }
        tr:hover { background-color: rgba(255, 255, 255, 0.05); transition: background-color 0.3s; }
        
        .login-container, .form-container {
            background-color: var(--surface-color);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 2rem;
            max-width: 28rem;
            margin: 0 auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }
        
        .form-group { margin-bottom: 1rem; }
        
        .header { display: flex; flex-direction: column; justify-content: space-between; align-items: center; margin-bottom: 2rem; gap: 1rem; padding: 18px; border: 1px solid var(--border); border-radius: 18px; box-shadow: 0 0 60px rgba(99,102,241,0.10); }
        @media (min-width: 768px) { .header { flex-direction: row; } }
        
        .header-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
        
        .card, .menu-item, .order-card, .table-card, .staff-card, .qr-card {
            background-color: var(--surface-color) !important;
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color) !important;
            border-radius: 1rem !important;
            padding: 1.5rem !important;
            box-shadow: 0 4px 30px rgba(99,102,241,0.05) !important;
            margin-bottom: 1.5rem !important;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            color: var(--text-primary);
        }
        .card:hover, .menu-item:hover, .order-card:hover, .table-card:hover, .staff-card:hover, .qr-card:hover {
            box-shadow: 0 8px 40px rgba(99,102,241,0.15) !important;
            border-color: rgba(99,102,241,0.2) !important;
            transform: translateY(-4px);
        }
        
        /* Table specifics */
        .table-card { text-align: center; justify-content: center; align-items: center; }
        .table-card h3 { margin-bottom: 0.5rem; }
        .table-card.occupied { border-color: rgba(239, 68, 68, 0.5) !important; box-shadow: 0 0 15px rgba(239, 68, 68, 0.2) !important; }
        .table-card.available { border-color: rgba(34, 197, 94, 0.5) !important; box-shadow: 0 0 15px rgba(34, 197, 94, 0.2) !important; }

        /* Kitchen Orders */
        .order-card h3 { display: flex; justify-content: space-between; align-items: center; font-size: 1.25rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; }
        .order-items { margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .order-item { display: flex; justify-content: space-between; font-size: 0.875rem; padding: 0.5rem; background-color: rgba(255, 255, 255, 0.05); border-radius: 0.5rem; }
        
        /* Buttons */
        button, .btn {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease-out;
            padding: 0.5rem 1.5rem;
            border-radius: 0.75rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
            border: none;
        }
        button:active, .btn:active { transform: scale(0.95); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .btn-primary, button[type="submit"], button[onclick*="login"], button[onclick*="generate"], .place-btn {
            background-color: var(--primary-color) !important;
            color: white !important;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2);
        }
        .btn-primary:hover, button[type="submit"]:hover, button[onclick*="login"]:hover, button[onclick*="generate"]:hover, .place-btn:hover {
            background-color: #4F46E5 !important;
        }
        
        .btn-danger { background-color: var(--error-color); color: #ffdad6; }
        .btn-danger:hover { background-color: #ffb4ab; color: #690005; }
        
        .btn-outline, .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
        }
        .btn-outline:hover, .btn-secondary:hover { background-color: rgba(99, 102, 241, 0.1); }
        
        .btn-small { padding: 0.375rem 0.75rem; font-size: 0.75rem; border-radius: 0.5rem; }
        
        .btn-success, .done-btn { background-color: var(--success-color) !important; color: white !important; }
        .btn-success:hover, .done-btn:hover { background-color: #388e3c !important; }

        .qty-btn { 
            width: 2rem; height: 2rem; border-radius: 0.5rem; padding: 0; display: inline-flex; 
            align-items: center; justify-content: center; font-weight: bold; background-color: rgba(255,255,255,0.1); color: var(--text-primary);
        }
        .qty-btn:hover { background-color: rgba(255,255,255,0.2); }
        
        .modal {
            position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center;
            background-color: rgba(8, 8, 8, 0.8); backdrop-filter: blur(4px); padding: 1rem;
        }
        .modal-content {
            background-color: rgba(17, 17, 17, 0.95); backdrop-filter: blur(12px); width: 100%; max-width: 42rem;
            border-radius: 1rem; padding: 2rem; border: 1px solid var(--border-color); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            position: relative; max-height: 90vh; overflow-y: auto; margin: auto; margin-top: 2.5rem;
        }
        .modal-close {
            position: absolute; right: 1rem; top: 1rem; color: rgba(255, 255, 255, 0.5); cursor: pointer; font-size: 1.5rem; line-height: 1;
        }
        .modal-close:hover { color: white; }
        
        .badge, .timer-badge {
            padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.05em; border: 1px solid transparent; display: inline-block;
        }
        .badge-active { background-color: rgba(34, 197, 94, 0.2); color: #4ade80; border-color: rgba(34, 197, 94, 0.3); }
        .badge-inactive { background-color: rgba(239, 68, 68, 0.2); color: #f87171; border-color: rgba(239, 68, 68, 0.3); }
        .badge-paid, .badge-premium, .status-paid, .status-ready { background-color: rgba(99, 102, 241, 0.2); color: var(--primary-color); border-color: rgba(99, 102, 241, 0.3); }
        .badge-trial, .status-pending, .status-preparing, .timer-badge { background-color: rgba(99, 102, 241, 0.3); color: #facc15; border-color: rgba(234, 179, 8, 0.3); }
        .badge-free { background-color: rgba(255, 255, 255, 0.05); color: var(--text-secondary); border-color: var(--border-color); }
        .status-delivered { background-color: rgba(34, 197, 94, 0.2); color: #4ade80; border-color: rgba(34, 197, 94, 0.3); }
        
        .stats-panel, .credentials-box, .order-details, .items-list {
            background-color: rgba(0, 0, 0, 0.3); padding: 1rem; border-radius: 0.75rem; border: 1px solid rgba(255, 255, 255, 0.05); margin-top: 1rem;
        }
        .stat-row { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .stat-row:last-child { border-bottom: none; }
        .stat-label { color: var(--text-secondary); font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .stat-value { font-weight: 700; color: var(--primary-color); font-size: 1.125rem; }
        
        .tabs, .tab-bar { display: flex; overflow-x: auto; border-bottom: 1px solid var(--border-color); margin-bottom: 1.5rem; padding-bottom: 0.5rem; gap: 1rem; }
        .tab { padding: 0.5rem 1rem; cursor: pointer; color: var(--text-secondary); border-bottom: 2px solid transparent; transition: color 0.3s; white-space: nowrap; }
        .tab:hover { color: white; }
        .tab.active { color: var(--primary-color); border-bottom-color: var(--primary-color); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        #orders-container, #menu-container, #staff-list, .grid-cards {
            display: grid; grid-template-columns: 1fr; gap: 1.5rem;
        }
        @media (min-width: 768px) { #orders-container, #menu-container, #staff-list, .grid-cards { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 1024px) { #orders-container, #menu-container, #staff-list, .grid-cards { grid-template-columns: repeat(3, 1fr); } }
        
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .item-row:last-child { border-bottom: none; }
        .modifier-group { background-color: rgba(0, 0, 0, 0.2); padding: 0.75rem; border-radius: 0.5rem; border: 1px solid rgba(255, 255, 255, 0.05); margin-bottom: 0.75rem; }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .qr-modal-overlay {
            position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center;
            background-color: rgba(8, 8, 8, 0.8); backdrop-filter: blur(4px); padding: 1rem;
        }
        .qr-modal {
            background-color: rgba(17, 17, 17, 0.95); backdrop-filter: blur(12px); border-radius: 1rem; padding: 2rem; border: 1px solid var(--border-color); text-align: center;
        }
        .qr-modal img { margin: 1rem auto; max-width: 200px; display: block; border-radius: 0.5rem; }
        .qr-url { word-break: break-all; color: var(--text-secondary); font-size: 0.875rem; }

        .subscription-overlay {
            display: none; position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; text-align: center; color: #F0F0F0;
        }
        
        /* Menu overrides that were lost when stripping tailwind */
        .table-card, .occupied, .available, .order-card, .done-btn, .timer-badge, .item-row, .qty-btn, .staff-card, .qr-card, .checkout-modal, .customer-card, .history-row, .menu-item-row { border-radius: 12px; }
        .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface-color); padding: 1rem; border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; z-index: 50; }
        .search-box { margin-bottom: 1rem; }
        .ornate-divider { display: flex; align-items: center; margin: 2rem 0 1rem; text-align: center; }
        .ornate-divider::before, .ornate-divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--primary-color); opacity: 0.3; }
        .scroll-mt-40 { scroll-margin-top: 10rem; }
        .glass-effect { background-color: rgba(17, 17, 17, 0.9); backdrop-filter: blur(12px); }

    </style>
</head>
<body>
    <div id="offline-banner" style="display:none; position:fixed; top:0; left:0; right:0; z-index:99999; background:#EF4444; color:white; text-align:center; padding:8px; font-size:13px; font-family:'Inter';">
      ⚡ You are offline — showing cached data
    </div>
    <div class="header">
        <h1>🏢 Restron Platform Admin</h1>
        <div class="header-actions">
            <button class="btn-primary" onclick="openCreateModal()">+ New Restaurant</button>
            <button class="btn-outline" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="card">
        <h2>📋 Restaurants</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Slug</th>
                    <th>Owner</th>
                    <th>Plan</th>
                    <th>Status</th>
                    <th>Orders (30d)</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="restaurant-table">
                <tr><td colspan="8" style="color:#666;">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <div id="stats-container" class="card" style="display:none;">
        <h2 id="stats-title">📊 Restaurant Stats</h2>
        <div class="stats-panel" id="stats-panel"></div>
    </div>

    <div id="create-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeCreateModal()">&times;</span>
            <h2 style="color:#a29bfe; margin-bottom:20px;">Create Restaurant</h2>
            <label>Restaurant Name *</label>
            <input id="cr-name" placeholder="e.g. Desi Zaika">
            <label>Slug * (URL-safe, lowercase)</label>
            <input id="cr-slug" placeholder="e.g. desi-zaika">
            <label>Owner Username *</label>
            <input id="cr-owner" placeholder="e.g. owner_desi">
            <label>Owner Password (leave blank to auto-generate)</label>
            <input id="cr-password" type="password" placeholder="Auto-generated if empty">
            <label>Address</label>
            <input id="cr-address" placeholder="Full address">
            <label>Phone</label>
            <input id="cr-phone" placeholder="Phone number">
            <label>Table Count</label>
            <input id="cr-tables" type="number" value="10">
            <label>Plan</label>
            <select id="cr-plan">
                <option value="trial">Trial</option>
                <option value="starter">Starter</option>
                <option value="growth">Growth</option>
                <option value="pro">Pro</option>
            </select>
            <button class="btn-primary" onclick="createRestaurant()" style="width:100%; margin-top:10px;">Create Restaurant</button>
            <div id="create-result" style="display:none;"></div>
        </div>
    </div>

    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeEditModal()">&times;</span>
            <h2 style="color:#a29bfe; margin-bottom:20px;">Edit Restaurant</h2>
            <input type="hidden" id="edit-id">
            <label>Status</label>
            <select id="edit-active">
                <option value="true">Active</option>
                <option value="false">Inactive</option>
            </select>
            <label>Plan</label>
            <select id="edit-plan">
                <option value="trial">Trial</option>
                <option value="starter">Starter</option>
                <option value="growth">Growth</option>
                <option value="pro">Pro</option>
            </select>
            <label>Plan Expires At (ISO date, leave blank for no expiry)</label>
            <input id="edit-expires" type="date" placeholder="YYYY-MM-DD">
            <label>Table Count</label>
            <input id="edit-tables" type="number" min="1">
            <button class="btn-primary" onclick="saveEdit()" style="width:100%; margin-top:10px;">Save Changes</button>
        </div>
    </div>

    <div id="reset-modal" class="modal">
        <div class="modal-content" style="max-width:400px;">
            <span class="modal-close" onclick="closeResetModal()">&times;</span>
            <h2 style="color:#a29bfe; margin-bottom:20px;">Reset Owner Password</h2>
            <input type="hidden" id="reset-restaurant-id">
            <p style="margin-bottom:16px; color:var(--text-secondary);">Owner: <strong id="reset-username-display"></strong></p>
            <label>New Password</label>
            <input id="reset-new-password" type="password" placeholder="Enter new password">
            <button class="btn-primary" onclick="submitResetPassword()" style="width:100%; margin-top:10px;">Reset Password</button>
        </div>
    </div>

    <script>
        async function loadRestaurants() {
            const res = await fetch('/superadmin/restaurants/');
            if (res.status === 401) {
                window.location.href = '/superadmin/login';
                return;
            }
            const data = await res.json();
            const tbody = document.getElementById('restaurant-table');

            if (!data.length) {
                tbody.innerHTML = '<tr><td colspan="8" style="color:#666;">No restaurants yet. Create one!</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            data.forEach(r => {
                const planBadge = r.plan === 'trial' ? 'badge-trial' : r.plan === 'free' ? 'badge-free' : 'badge-paid';
                const statusBadge = r.is_active ? 'badge-active' : 'badge-inactive';
                tbody.innerHTML += `
                    <tr>
                        <td>${r.id}</td>
                        <td><strong>${r.name}</strong></td>
                        <td><code>${r.slug || '-'}</code></td>
                        <td>${r.owner_username || '-'}</td>
                        <td><span class="badge ${planBadge}">${r.plan || 'free'}</span></td>
                        <td><span class="badge ${statusBadge}">${r.is_active ? 'Active' : 'Inactive'}</span></td>
                        <td>${r.order_count_30d}</td>
                        <td>
                            <button class="btn-small btn-outline" onclick="viewStats(${r.id})">Stats</button>
                            <button class="btn-small btn-outline" onclick="editRestaurant(${r.id}, ${r.is_active}, '${r.plan || 'trial'}', '${r.plan_expires_at || ''}', ${r.table_count || 10})">Edit</button>
                            <button class="btn-small btn-outline" onclick="copyCredentials('${r.name}', '${r.slug}', '${r.owner_username || ''}')">Copy Creds</button>
                            <button class="btn-small btn-outline" onclick="openResetModal(${r.id}, '${r.owner_username || ''}')">Reset Pwd</button>
                            ${r.is_active
                                ? `<button class="btn-small btn-danger" onclick="toggleActive(${r.id}, false)">Deactivate</button>`
                                : `<button class="btn-small btn-primary" onclick="toggleActive(${r.id}, true)">Activate</button>`
                            }
                        </td>
                    </tr>
                `;
            });
        }

        function openCreateModal() {
            document.getElementById('create-modal').style.display = 'block';
            document.getElementById('create-result').style.display = 'none';
        }

        function closeCreateModal() {
            document.getElementById('create-modal').style.display = 'none';
        }

        async function createRestaurant() {
            const payload = {
                restaurant_name: document.getElementById('cr-name').value,
                slug: document.getElementById('cr-slug').value.toLowerCase().replace(/\s+/g, '-'),
                owner_username: document.getElementById('cr-owner').value,
                owner_password: document.getElementById('cr-password').value || '',
                address: document.getElementById('cr-address').value,
                phone: document.getElementById('cr-phone').value,
                table_count: parseInt(document.getElementById('cr-tables').value) || 10,
                plan: document.getElementById('cr-plan').value,
            };

            if (!payload.restaurant_name || !payload.slug || !payload.owner_username) {
                alert('Restaurant name, slug, and owner username are required!');
                return;
            }

            const res = await fetch('/superadmin/restaurants/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (res.ok) {
                const resultDiv = document.getElementById('create-result');
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `
                    <div class="credentials-box">
                        <h4>✅ Restaurant Created!</h4>
                        <p>Login URL: <code>/r/${data.restaurant.slug}/login</code></p>
                        <p>Owner Username: <code>${data.owner.username}</code></p>
                        <p>Owner Password: <code>${data.owner.password}</code></p>
                        <p style="color:#fdcb6e; font-size:0.85em; margin-top:10px;">⚠️ Save these credentials — the password cannot be recovered.</p>
                    </div>
                `;
                loadRestaurants();
            } else {
                alert(data.detail || 'Failed to create restaurant');
            }
        }

        async function toggleActive(restaurantId, activate) {
            const action = activate ? 'activate' : 'deactivate';
            if (!confirm(`Are you sure you want to ${action} this restaurant?`)) return;

            const res = await fetch(`/superadmin/restaurants/${restaurantId}`, {
                method: 'PATCH',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ is_active: activate })
            });
            if (res.ok) loadRestaurants();
            else alert('Failed to update restaurant');
        }

        async function viewStats(restaurantId) {
            try {
                const res = await fetch(`/superadmin/restaurants/${restaurantId}/stats`, { credentials: 'include' });
                if (!res.ok) { alert('Failed to load stats: ' + res.status); return; }
                const data = await res.json();
                const container = document.getElementById('stats-container');
                container.style.display = 'block';
                document.getElementById('stats-title').innerText = `📊 ${data.name} — Stats`;
                document.getElementById('stats-panel').innerHTML = `
                    <div class="stat-row"><span class="stat-label">Total Orders</span><span class="stat-value">${data.order_count}</span></div>
                    <div class="stat-row"><span class="stat-label">Total Revenue</span><span class="stat-value">₹${data.revenue_total}</span></div>
                    <div class="stat-row"><span class="stat-label">Last Activity</span><span class="stat-value">${data.last_activity ? new Date(data.last_activity).toLocaleString() : 'No activity'}</span></div>
                `;
                container.scrollIntoView({ behavior: 'smooth' });
            } catch (err) {
                alert('Network error loading stats: ' + err.message);
            }
        }

        function editRestaurant(id, isActive, plan, expiresAt, tableCount) {
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-active').value = String(isActive);
            document.getElementById('edit-plan').value = plan;
            document.getElementById('edit-expires').value = expiresAt ? expiresAt.split('T')[0] : '';
            document.getElementById('edit-tables').value = tableCount;
            document.getElementById('edit-modal').style.display = 'block';
        }

        function closeEditModal() {
            document.getElementById('edit-modal').style.display = 'none';
        }

        async function saveEdit() {
            const id = document.getElementById('edit-id').value;
            const payload = {
                is_active: document.getElementById('edit-active').value === 'true',
                plan: document.getElementById('edit-plan').value,
                plan_set_by: 'superadmin',
                table_count: parseInt(document.getElementById('edit-tables').value) || 10,
            };
            const expiresVal = document.getElementById('edit-expires').value;
            if (expiresVal) {
                payload.plan_expires_at = expiresVal + 'T23:59:59';
            } else {
                payload.plan_expires_at = null;
            }

            const res = await fetch(`/superadmin/restaurants/${id}`, {
                method: 'PATCH',
                headers: {'Content-Type': 'application/json'},
                credentials: 'include',
                body: JSON.stringify(payload)
            });
            if (res.ok) {
                alert('Restaurant updated successfully!');
                closeEditModal();
                loadRestaurants();
            } else {
                const err = await res.json().catch(() => ({ detail: 'Unknown error' }));
                alert('Failed: ' + (err.detail || 'Unknown error'));
            }
        }

        async function logout() {
            await fetch('/superadmin/logout', { method: 'POST' });
            window.location.href = '/superadmin/login';
        }

        function copyCredentials(name, slug, ownerUsername) {
            const loginUrl = window.location.origin + '/r/' + slug + '/login';
            const text = 'Restaurant: ' + name + '\nLogin URL: ' + loginUrl + '\nOwner Username: ' + ownerUsername;
            navigator.clipboard.writeText(text).then(() => {
                alert('Credentials copied to clipboard!');
            }).catch(() => {
                prompt('Copy these credentials:', text);
            });
        }

        function openResetModal(restaurantId, ownerUsername) {
            document.getElementById('reset-restaurant-id').value = restaurantId;
            document.getElementById('reset-username-display').innerText = ownerUsername || 'Unknown';
            document.getElementById('reset-new-password').value = '';
            document.getElementById('reset-modal').style.display = 'block';
        }

        function closeResetModal() {
            document.getElementById('reset-modal').style.display = 'none';
        }

        async function submitResetPassword() {
            const id = document.getElementById('reset-restaurant-id').value;
            const newPassword = document.getElementById('reset-new-password').value;
            if (!newPassword || newPassword.length < 4) {
                alert('Password must be at least 4 characters');
                return;
            }
            const res = await fetch('/superadmin/restaurants/' + id + '/reset-password', {
                method: 'PATCH',
                headers: {'Content-Type': 'application/json'},
                credentials: 'include',
                body: JSON.stringify({ new_password: newPassword })
            });
            const data = await res.json();
            if (res.ok) {
                alert('Password reset for ' + data.username);
                closeResetModal();
            } else {
                alert('Failed: ' + (data.detail || 'Unknown error'));
            }
        }

        loadRestaurants();

        function updateOnlineStatus() {
          const banner = document.getElementById('offline-banner');
          if (banner) banner.style.display = navigator.onLine ? 'none' : 'block';
        }
        window.addEventListener('online', () => {
          updateOnlineStatus();
          loadRestaurants();
        });
        window.addEventListener('offline', updateOnlineStatus);
        document.addEventListener('DOMContentLoaded', updateOnlineStatus);
    </script>
</body>
</html>
