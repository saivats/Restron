<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Receipt — Restron</title>
    <meta name="description" content="Your Restron receipt — digital invoice with GST breakdown.">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#131313">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Restron">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', {scope: '/'})
        .then(reg => console.log('SW registered'))
        .catch(err => console.log('SW failed:', err));
    }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0C0C0C;
            --bg-surface: #131313;
            --bg-card: #161616;
            --primary: #eab308;
            --primary-dark: #a16207;
            --secondary: #d0bcff;
            --text-primary: #e5e2e1;
            --text-muted: #888888;
            --border: rgba(234, 179, 8, 0.15);
            --glow: rgba(234, 179, 8, 0.08);
            --success: #4edea3;
            --danger: #EF4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: var(--bg-base);
            background-image: radial-gradient(ellipse at 20% 0%, rgba(192,193,255,0.06) 0%, transparent 50%), radial-gradient(ellipse at 80% 100%, rgba(234,179,8,0.04) 0%, transparent 50%);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            padding: 24px 14px;
        }
        h1, h2, h3 { font-family: 'Playfair Display', serif; color: var(--primary); }
        .receipt-shell { max-width: 600px; margin: 0 auto; }
        .receipt-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.55), 0 0 80px rgba(234,179,8,0.06);
        }
        .brand { text-align: center; padding-bottom: 20px; border-bottom: 1px dashed var(--border); }
        #restaurant-name { font-size: 36px; margin-bottom: 8px; }
        .muted { color: var(--text-muted); font-size: 14px; line-height: 1.5; }
        .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 22px 0; }
        .meta-box { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
        .meta-label { color: var(--text-muted); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
        table { width: 100%; border-collapse: collapse; margin: 16px 0; }
        th { padding: 12px 10px; text-align: left; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border); }
        td { padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.04); color: var(--text-primary); }
        tr:hover td { background: rgba(234,179,8,0.04); }
        .right { text-align: right; }
        .center { text-align: center; }
        .totals { margin-top: 16px; background: rgba(0,0,0,0.22); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
        .total-row { display: flex; justify-content: space-between; padding: 8px 0; color: var(--text-muted); }
        .grand-total { color: var(--primary); font-size: 24px; font-weight: 800; border-top: 1px solid var(--border); margin-top: 8px; padding-top: 14px; }
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
        .btn {
            padding: 12px 18px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            transition: all 0.15s ease;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: linear-gradient(135deg, #eab308, #a16207); color: black; }
        .btn-primary:hover { box-shadow: 0 4px 16px rgba(234,179,8,0.4); }
        .btn-success { background: linear-gradient(135deg, #22C55E, #1D5A3F); color: white; }
        @media print {
            body { background: white; color: #111; padding: 0; }
            .receipt-card { box-shadow: none; border: none; color: #111; }
            .actions { display: none; }
        }
    </style>
</head>
<body>
    <div id="offline-banner" style="display:none; position:fixed; top:0; left:0; right:0; z-index:99999; background:#EF4444; color:white; text-align:center; padding:8px; font-size:13px; font-family:'Inter';">
      ⚡ You are offline
    </div>
    <main class="receipt-shell">
        <section class="receipt-card">
            <div class="brand">
                <h1 id="restaurant-name">Restron</h1>
                <p class="muted" id="restaurant-address">Loading address...</p>
                <p class="muted" id="restaurant-phone"></p>
                <p class="muted" id="restaurant-gstin"></p>
            </div>

            <div class="meta-grid">
                <div class="meta-box">
                    <div class="meta-label">Invoice</div>
                    <strong id="order-id">Loading...</strong>
                </div>
                <div class="meta-box">
                    <div class="meta-label">Time</div>
                    <strong id="order-time">--</strong>
                </div>
                <div class="meta-box">
                    <div class="meta-label">Order</div>
                    <strong id="order-type">--</strong>
                </div>
                <div class="meta-box">
                    <div class="meta-label">Payment</div>
                    <strong id="payment-method">--</strong>
                </div>
            </div>

            <table>
                <thead>
                    <tr><th>Item</th><th class="center">Qty</th><th class="right">Amount</th></tr>
                </thead>
                <tbody id="receipt-items">
                    <tr><td colspan="3" class="center muted">Loading items...</td></tr>
                </tbody>
            </table>

            <div class="totals">
                <div class="total-row"><span>Subtotal</span><span id="receipt-subtotal">&#8377;0.00</span></div>
                <div class="total-row"><span>Discount</span><span id="receipt-discount">&#8377;0.00</span></div>
                <div class="total-row"><span>CGST</span><span id="receipt-cgst">&#8377;0.00</span></div>
                <div class="total-row"><span>SGST</span><span id="receipt-sgst">&#8377;0.00</span></div>
                <div class="total-row"><span>GST Total</span><span id="receipt-gst-amount">&#8377;0.00</span></div>
                <div class="total-row grand-total"><span>Total</span><span id="receipt-total">&#8377;0.00</span></div>
            </div>

            <p class="muted" style="text-align:center; margin-top:18px;">Thank you for dining with us.</p>

            <div class="actions">
                <button class="btn btn-primary" id="download-pdf-btn">Download PDF</button>
                <button class="btn btn-success" id="whatsapp-share-btn">WhatsApp Share</button>
            </div>
        </section>
    </main>

    <script>
        let pdfDownloadPath = '';
        let whatsappText = '';

        document.getElementById('download-pdf-btn').addEventListener('click', function(e) {
            e.preventDefault();
            if (pdfDownloadPath) window.location.href = `/${pdfDownloadPath}`;
            else window.print();
        });

        document.getElementById('whatsapp-share-btn').addEventListener('click', function() {
            const text = encodeURIComponent(whatsappText || 'Thank you for dining with us.');
            window.open(`https://wa.me/?text=${text}`, '_blank');
        });

        async function fetchReceiptData() {
            const pathParts = window.location.pathname.split('/');
            const slug = pathParts[2] || 'default';
            const orderId = pathParts[4] || pathParts[pathParts.length - 1];
            const token = new URLSearchParams(window.location.search).get('t');
            try {
                const url = token
                    ? `/r/${slug}/receipt/${orderId}/data?t=${encodeURIComponent(token)}`
                    : `/r/${slug}/receipt/${orderId}/data`;
                const res = await fetch(url);
                if (!res.ok) {
                    alert('Failed to load receipt.');
                    return;
                }
                const data = await res.json();
                const currency = data.business.currency_symbol || '₹';
                document.getElementById('restaurant-name').innerText = data.business.name || 'Restron';
                document.getElementById('restaurant-address').innerText = data.business.address || '';
                document.getElementById('restaurant-phone').innerText = data.business.phone || '';
                document.getElementById('restaurant-gstin').innerText = data.business.gstin ? `GSTIN: ${data.business.gstin}` : '';
                document.getElementById('order-id').innerText = data.invoice_number || `#${data.order_id}`;
                document.getElementById('order-time').innerText = data.date || '--';
                document.getElementById('order-type').innerText = `${data.type || 'Dine-in'} | Table ${data.table || 'N/A'}`;
                document.getElementById('payment-method').innerText = data.payment_method || '--';

                const itemsContainer = document.getElementById('receipt-items');
                itemsContainer.innerHTML = '';
                data.items.forEach(item => {
                    const total = item.total != null ? item.total : item.qty * item.price;
                    itemsContainer.innerHTML += `
                        <tr>
                            <td>${item.name}</td>
                            <td class="center">${item.qty}</td>
                            <td class="right">${currency}${total.toFixed(2)}</td>
                        </tr>`;
                });

                document.getElementById('receipt-subtotal').innerText = `${currency}${data.subtotal.toFixed(2)}`;
                document.getElementById('receipt-discount').innerText = `${currency}${(data.discount || 0).toFixed(2)}`;
                document.getElementById('receipt-cgst').innerText = `${currency}${(data.cgst || 0).toFixed(2)}`;
                document.getElementById('receipt-sgst').innerText = `${currency}${(data.sgst || 0).toFixed(2)}`;
                document.getElementById('receipt-gst-amount').innerText = `${currency}${data.gst.toFixed(2)}`;
                document.getElementById('receipt-total').innerText = `${currency}${data.total.toFixed(2)}`;
                pdfDownloadPath = data.receipt_upload_path || '';
                whatsappText = data.whatsapp_text || '';
            } catch (err) {
                console.error('Error fetching receipt:', err);
            }
        }

        document.addEventListener('DOMContentLoaded', fetchReceiptData);

        function updateOnlineStatus() {
          const banner = document.getElementById('offline-banner');
          if (banner) banner.style.display = navigator.onLine ? 'none' : 'block';
        }
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        document.addEventListener('DOMContentLoaded', updateOnlineStatus);
    </script>
</body>
</html>
