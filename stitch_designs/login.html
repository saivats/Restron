<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Staff Login - Restron</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@600;700&amp;family=Playfair+Display:ital,wght@0,400;0,600;1,400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#c0c1ff",
                        "border-glass": "rgba(255, 255, 255, 0.08)",
                        "outline": "#908fa0",
                        "tertiary-fixed": "#6ffbbe",
                        "on-tertiary-container": "#000703",
                        "on-error-container": "#ffdad6",
                        "on-surface": "#e5e2e1",
                        "danger": "#EF4444",
                        "inverse-surface": "#e5e2e1",
                        "secondary-fixed": "#e9ddff",
                        "tertiary-fixed-dim": "#4edea3",
                        "on-tertiary-fixed-variant": "#005236",
                        "surface-container-lowest": "#0e0e0e",
                        "background": "#131313",
                        "on-primary": "#1000a9",
                        "on-secondary-fixed": "#23005c",
                        "surface-container": "#201f1f",
                        "secondary-container": "#571bc1",
                        "outline-variant": "#464554",
                        "on-secondary-container": "#c4abff",
                        "secondary": "#d0bcff",
                        "surface-bright": "#3a3939",
                        "primary-fixed-dim": "#c0c1ff",
                        "surface-container-high": "#2a2a2a",
                        "on-background": "#e5e2e1",
                        "inverse-on-surface": "#313030",
                        "on-tertiary-fixed": "#002113",
                        "error-container": "#93000a",
                        "error": "#ffb4ab",
                        "warning": "#F59E0B",
                        "surface-dim": "#131313",
                        "on-primary-container": "#0d0096",
                        "surface": "#0C0C0C",
                        "on-primary-fixed": "#07006c",
                        "tertiary-container": "#00885d",
                        "card": "#161616",
                        "on-error": "#690005",
                        "text-muted": "#888888",
                        "primary-fixed": "#e1e0ff",
                        "inverse-primary": "#494bd6",
                        "on-tertiary": "#003824",
                        "on-secondary-fixed-variant": "#5516be",
                        "surface-tint": "#c0c1ff",
                        "surface-variant": "#353534",
                        "surface-container-highest": "#353534",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "secondary-fixed-dim": "#d0bcff",
                        "elevated": "#1A1A1A",
                        "on-surface-variant": "#c7c4d7",
                        "surface-container-low": "#1c1b1b",
                        "primary-container": "#8083ff",
                        "on-secondary": "#3c0091",
                        "tertiary": "#4edea3",
                        "gold": {
                            "light": "#fef08a",
                            "DEFAULT": "#eab308",
                            "dark": "#a16207"
                        }
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-safe": "20px",
                        "lg": "24px",
                        "xs": "4px",
                        "md": "16px",
                        "sm": "8px",
                        "base": "4px",
                        "gutter": "16px",
                        "xl": "48px"
                    },
                    "fontFamily": {
                        "label-caps": ["Inter"],
                        "data-lg": ["JetBrains Mono"],
                        "body-sm": ["Inter"],
                        "data-sm": ["JetBrains Mono"],
                        "body-base": ["Inter"],
                        "headline-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "serif": ["Playfair Display", "serif"]
                    },
                    "fontSize": {
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.06em", "fontWeight": "700" }],
                        "data-lg": ["32px", { "lineHeight": "1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400" }],
                        "data-sm": ["14px", { "lineHeight": "1.4", "letterSpacing": "0", "fontWeight": "600" }],
                        "body-base": ["16px", { "lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "800" }]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .bg-space {
            background-color: #080808;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(99, 102, 241, 0.05) 0%, transparent 50%);
        }

        .glass-card {
            background: rgba(12, 12, 12, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.5);
        }

        .input-glow:focus-within {
            border-color: #eab308;
            box-shadow: 0 0 0 1px rgba(234, 179, 8, 0.3);
        }

        .role-btn.active {
            background-color: rgba(234, 179, 8, 0.1);
            color: #eab308;
            border-color: rgba(234, 179, 8, 0.5);
        }
        
        .role-btn:active {
            transform: scale(0.97);
        }

        .gold-btn {
            background: rgba(12, 12, 12, 0.8);
            border: 1px solid rgba(234, 179, 8, 0.5);
            color: #eab308;
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.15);
            transition: all 0.3s ease;
        }
        
        .gold-btn:hover {
            box-shadow: 0 0 25px rgba(234, 179, 8, 0.3);
            background: rgba(234, 179, 8, 0.1);
        }
        
        .gold-btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body class="bg-space min-h-screen flex items-center justify-center p-md md:p-lg antialiased text-on-surface selection:bg-gold-light selection:text-surface">
<main class="w-full max-w-[440px] flex flex-col items-center gap-lg">
<!-- Brand -->
<div class="text-center">
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-primary tracking-tighter mb-xs">Restron</h1>
<p class="font-body-sm text-body-sm text-text-muted flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[16px]">storefront</span>
<span>restaurante-el-faro</span>
</p>
</div>
<!-- Login Card -->
<div class="glass-card w-full rounded-xl p-lg flex flex-col gap-lg relative overflow-hidden">
<!-- Top highlight -->
<div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
<div class="flex flex-col gap-sm">
<h2 class="font-headline-md text-headline-md text-on-surface">Staff Access</h2>
<p class="font-body-sm text-body-sm text-text-muted">Enter your credentials to continue.</p>
</div>
<!-- Role Selector (Bento style small grid) -->
<div class="grid grid-cols-2 gap-sm">
<button class="role-btn active flex items-center justify-center gap-sm p-sm rounded-lg border border-border-glass bg-elevated transition-all duration-200">
<span class="material-symbols-outlined text-[18px]">manage_accounts</span>
<span class="font-data-sm text-data-sm">Manager</span>
</button>
<button class="role-btn flex items-center justify-center gap-sm p-sm rounded-lg border border-border-glass bg-elevated hover:bg-surface-variant transition-all duration-200">
<span class="material-symbols-outlined text-[18px]">room_service</span>
<span class="font-data-sm text-data-sm">Waiter</span>
</button>
<button class="role-btn flex items-center justify-center gap-sm p-sm rounded-lg border border-border-glass bg-elevated hover:bg-surface-variant transition-all duration-200">
<span class="material-symbols-outlined text-[18px]">soup_kitchen</span>
<span class="font-data-sm text-data-sm">Chef</span>
</button>
<button class="role-btn flex items-center justify-center gap-sm p-sm rounded-lg border border-border-glass bg-elevated hover:bg-surface-variant transition-all duration-200">
<span class="material-symbols-outlined text-[18px]">key</span>
<span class="font-data-sm text-data-sm">Owner</span>
</button>
</div>
<form class="flex flex-col gap-md">
<!-- Username Input -->
<div class="flex flex-col gap-xs">
<label class="font-serif text-[15px] italic text-gold ml-xs" for="username">Username</label>
<div class="input-glow relative flex items-center bg-transparent border border-[rgba(234,179,8,0.3)] rounded-lg overflow-hidden transition-all duration-200">
<span class="material-symbols-outlined absolute left-md text-gold-dark">person</span>
<input autocomplete="username" class="w-full bg-transparent border-none py-[12px] pl-xl pr-md font-body-base text-body-base text-on-surface focus:ring-0 placeholder:text-surface-variant" id="username" placeholder="Enter username" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<label class="font-serif text-[15px] italic text-gold ml-xs" for="password">Password</label>
<div class="input-glow relative flex items-center bg-transparent border border-[rgba(234,179,8,0.3)] rounded-lg overflow-hidden transition-all duration-200">
<span class="material-symbols-outlined absolute left-md text-gold-dark">lock</span>
<input autocomplete="current-password" class="w-full bg-transparent border-none py-[12px] pl-xl pr-md font-body-base text-body-base text-on-surface focus:ring-0 placeholder:text-surface-variant" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Submit -->
<button class="gold-btn w-full h-[52px] rounded-lg flex items-center justify-center gap-sm font-data-sm text-data-sm mt-sm transition-all duration-150" type="submit">
<span>Login</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
</div>
<!-- Footer links -->
<div class="flex justify-center gap-lg font-body-sm text-body-sm text-text-muted mt-md">
<a class="hover:text-primary transition-colors" href="#">Clock In</a>
<a class="hover:text-primary transition-colors" href="#">Help</a>
</div>
</main>
<script>
        // Simple role selection interaction
        document.querySelectorAll('.role-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.role-btn').forEach(b => {
                    b.classList.remove('active');
                    b.classList.remove('text-[#eab308]');
                    b.classList.remove('bg-[rgba(234,179,8,0.1)]');
                    b.classList.remove('border-[rgba(234,179,8,0.5)]');
                    b.classList.add('bg-elevated');
                    b.classList.add('border-border-glass');
                });
                btn.classList.add('active');
                btn.classList.remove('bg-elevated');
                btn.classList.remove('border-border-glass');
                
                // Focus username input after selecting role
                document.getElementById('username').focus();
            });
        });
    </script>
</body></html>
